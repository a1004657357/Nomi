<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nomi notification and model status review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; background: #efefed; color: #292825; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); min-height: 100vh; }
    section { position: relative; min-height: 760px; padding: 84px 24px 24px; overflow: hidden; }
    section.dark { background: #201f1d; color: #eeece8; }
    section.light { background: #fafaf8; }
    header { position: absolute; inset: 0 0 auto; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e4e3df; background: #fff; }
    .dark header { background: #262522; border-color: #3c3a36; }
    .brand { font-family: Georgia, serif; font-size: 17px; }
    .brand b { color: #5579c9; }
    .nav { display: flex; gap: 20px; color: #77736d; font-size: 12px; }
    .stage { height: 640px; border: 1px solid #e8e6e1; background-image: radial-gradient(#dedbd5 1px, transparent 1px); background-size: 24px 24px; }
    .dark .stage { border-color: #363531; background-image: radial-gradient(#494641 1px, transparent 1px); }
    .notifications { position: absolute; top: 68px; right: 16px; width: 344px; display: grid; gap: 8px; }
    .toast { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 44px; padding: 10px 10px 10px 12px; border: 1px solid #e3e1dc; border-radius: 10px; background: #fff; box-shadow: 0 10px 24px rgba(25, 24, 22, .10); }
    .dark .toast { background: #292825; border-color: #44413c; box-shadow: 0 12px 28px rgba(0, 0, 0, .28); }
    .icon { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; font-size: 11px; font-weight: 700; }
    .icon.info { color: #77736d; }
    .icon.success { color: #2d9148; }
    .icon.error { color: #d94a43; }
    .message { min-width: 0; color: inherit; }
    .action { border: 0; border-radius: 6px; padding: 4px 8px; background: #edf1fa; color: #4267b6; font: inherit; font-weight: 600; }
    .panel { position: absolute; top: 220px; right: 16px; width: 320px; overflow: hidden; border: 1px solid #dedcd7; border-radius: 14px; background: #fff; box-shadow: 0 18px 40px rgba(25, 24, 22, .14); }
    .dark .panel { background: #292825; border-color: #44413c; box-shadow: 0 18px 40px rgba(0, 0, 0, .34); }
    .panel-title { display: flex; justify-content: space-between; padding: 9px 12px; color: #77736d; border-bottom: 1px solid #eceae5; font-size: 12px; font-weight: 600; }
    .dark .panel-title { border-color: #3b3935; }
    .content { padding: 12px; }
    .label { margin-bottom: 7px; color: #8c8881; font-size: 11px; }
    .caps { display: flex; gap: 6px; margin-bottom: 14px; }
    .cap { padding: 4px 8px; border-radius: 6px; background: #edf1fa; color: #4267b6; font-size: 12px; }
    .dark .cap, .dark .action { background: #303a50; color: #8eaceb; }
    .provider { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px; border: 1px solid #e4e2dd; border-radius: 10px; }
    .dark .provider { border-color: #45423d; }
    .logo { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: #292825; color: #fff; font-weight: 700; }
    .meta strong, .meta small { display: block; }
    .meta small { margin-top: 1px; color: #8c8881; font-size: 11px; }
    .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; background: #f3f2ef; color: #77736d; font-size: 11px; font-weight: 600; }
    .dark .status { background: #35332f; color: #aaa69e; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #34c759; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } section { min-height: 760px; } }
  </style>
</head>
<body>
  <main>
    <section class="light">
      <header><span class="brand">No<b>m</b>i</span><span class="nav"><span>任务</span><span>设置</span><span>模型接入</span><span>去出片</span></span></header>
      <div class="stage"></div>
      <div class="notifications">
        <div class="toast"><span class="icon info">i</span><span class="message">开始生成 2 个节点</span><span></span></div>
        <div class="toast"><span class="icon error">!</span><span class="message">1 个节点生成失败</span><button class="action">重试</button></div>
      </div>
      <div class="panel">
        <div class="panel-title"><span>模型设置</span><span>×</span></div>
        <div class="content">
          <div class="label">当前能力</div>
          <div class="caps"><span class="cap">图片 3</span><span class="cap">视频 1</span><span class="cap">文本 2</span></div>
          <div class="label">已接入</div>
          <div class="provider"><span class="logo">A</span><span class="meta"><strong>APIMart</strong><small>一个 key，解锁全部预置模型</small></span><span class="status"><i class="dot"></i>已连通</span></div>
        </div>
      </div>
    </section>
    <section class="dark">
      <header><span class="brand">No<b>m</b>i</span><span class="nav"><span>任务</span><span>设置</span><span>模型接入</span><span>去出片</span></span></header>
      <div class="stage"></div>
      <div class="notifications">
        <div class="toast"><span class="icon success">✓</span><span class="message">已完成 2 个节点</span><span></span></div>
        <div class="toast"><span class="icon info">i</span><span class="message">模型已切换为批量图片 B</span><span></span></div>
      </div>
      <div class="panel">
        <div class="panel-title"><span>模型设置</span><span>×</span></div>
        <div class="content">
          <div class="label">当前能力</div>
          <div class="caps"><span class="cap">图片 3</span><span class="cap">视频 1</span><span class="cap">文本 2</span></div>
          <div class="label">已接入</div>
          <div class="provider"><span class="logo">A</span><span class="meta"><strong>APIMart</strong><small>一个 key，解锁全部预置模型</small></span><span class="status"><i class="dot"></i>已连通</span></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
