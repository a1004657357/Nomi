<!doctype html><html lang="zh-CN" data-mantine-color-scheme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nomi · 节点效果 chip 样张</title><link rel="stylesheet" href="../../../../src/theme/nomi-tokens.css"><link rel="stylesheet" href="/tailwind.generated.css"><link rel="stylesheet" href="./style.css"><script src="./content.js"></script></head><body><main class="workspace"><aside class="sidebar"><div class="header"><strong>技能与提示词</strong><span class="wordmark">Nomi</span><span class="muted">55</span></div><div class="tabs"><button class="selected" data-tab="skills">技能库</button><button data-tab="prompts">提示词库</button></div><input class="search" aria-label="搜索技能或效果" placeholder="搜索技能或效果…"><div class="groups"><button class="active">全部</button><button>角色与场景</button><button>广告</button><button>修图</button></div><div class="grid"><button class="card" data-index="0"><img src="../../../../skills/curated-multi-view/assets/preview.jpg" alt="多视图设定的原仓产物"><div class="copy"><strong>多视图设定</strong><p>把同一主体整理成一致的多面设定。</p></div></button><button class="card" data-index="1"><img src="../../../../skills/curated-product-condensation/assets/preview.png" alt="凝露产品广告的原仓产物"><div class="copy"><strong>凝露产品广告</strong><p>用微距、水滴和环绕镜头展示产品质感。</p></div></button><button class="card" data-index="2"><img src="../../../../skills/curated-cross-view/assets/preview.jpg" alt="跨视角构图的原仓产物"><div class="copy"><strong>跨视角构图</strong><p>把参考画面转成另一机位，核对空间关系。</p></div></button><button class="card" data-index="3"><img src="../../../../skills/curated-coffee-pour/assets/preview.png" alt="咖啡倾注特写的原仓产物"><div class="copy"><strong>咖啡倾注特写</strong><p>把注入、油脂和蒸汽拆成清楚的镜头节拍。</p></div></button><button class="card" data-index="4"><img src="../../../../skills/curated-product-exploded-view/assets/preview.png" alt="产品爆炸视图的原仓产物"><div class="copy"><strong>产品爆炸视图</strong><p>让部件分离展示后归位，保持产品结构。</p></div></button><button class="card" data-index="5"><img src="../../../../skills/curated-outpaint/assets/preview.jpg" alt="自然扩图的原仓产物"><div class="copy"><strong>自然扩图</strong><p>补齐边缘空白，核对纹理与透视衔接。</p></div></button></div><div class="mode-note">原仓配图 · 完整来源可在详情查看。<br>新增插画尚待选定风格。</div></aside><section class="stage"><div class="node" style="top:48px;height:240px"><img src="../../../../skills/curated-multi-view/assets/preview.jpg" alt="连接的主体参考"><span class="node-label">参考主体 · 多视图</span></div><span class="state-label" style="top:318px">空框 · 常用效果直接可见</span><div class="composer" style="top:344px"><div class="composer-top"><span class="reference"><img src="../../../../skills/curated-multi-view/assets/preview.jpg" alt="参考缩略图">主体参考</span><span>提示词</span></div><div class="editor" id="editor" contenteditable="true" role="textbox" aria-label="示例节点提示词"></div><div class="effects"><span id="favorites"><button data-effect="effect-character-three-view">人物三视图</button><button data-effect="effect-scene-three-view">场景三视图</button><button data-effect="effect-natural-texture">去 AI 感</button><button data-effect="effect-fill-outpaint">自然扩图</button></span><button class="more" aria-expanded="true">更多 ▾</button><div class="menu"><section><strong>构图</strong><button data-effect="effect-camera-14">画框构图</button><button data-effect="effect-camera-15">对角线构图</button><button data-effect="effect-camera-16">绝对对称</button><button data-effect="effect-camera-17">三分法构图</button><button data-effect="effect-camera-18">前景遮挡</button><button data-effect="effect-camera-19">后景虚化</button><button data-effect="effect-camera-20">前景虚化</button><button data-effect="effect-overhead-view">俯视构图</button></section><section><strong>角色设定</strong><button data-effect="effect-character-three-view">人物三视图</button><button data-effect="effect-expression-grid">表情九宫格</button><button data-effect="effect-object-six-view">物件六视图</button><button data-effect="effect-transfer-expression">参考表情</button></section><section><strong>修图</strong><button data-effect="effect-fill-outpaint">自然扩图</button><button data-effect="effect-restore-drawing">旧图重绘</button></section><section><strong>去 AI 感</strong><button data-effect="effect-natural-texture">去 AI 感</button></section><section><strong>场景</strong><button data-effect="effect-scene-three-view">场景三视图</button></section><section><strong>分镜</strong><button data-effect="effect-storyboard-panels">宽屏分镜</button></section></div></div><div class="footer"><span class="muted"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/></svg></span><button>选择模型 ▾</button><button>优化</button><button>1 张 ▾</button><button class="generate" aria-label="示例生成">↑</button></div></div><span class="state-label" style="top:594px">已有内容 · 只留「更多 ▾」</span><div class="composer filled" style="top:620px"><div class="editor" id="filled-editor" contenteditable="true" role="textbox" aria-label="已有内容的示例节点">柔和的自然光，保持原有服装和构图。</div><div class="effects"><button class="more" id="filled-more">更多 ▾</button></div><div class="footer"><button>选择模型 ▾</button><button>优化</button><button>1 张 ▾</button><button class="generate">↑</button></div></div></section></main><div class="toast" role="status" hidden><span id="toast-text"></span><button id="undo">撤销</button></div><script>
const effects=nomiMockupEffects;const editor=document.querySelector('#editor'),menu=document.querySelector('.menu'),favorites=document.querySelector('#favorites'),toast=document.querySelector('.toast');let history=[],activeEditor=editor;const reference={subject:'连接的主体参考'};
function sync(){favorites.hidden=editor.textContent.trim().length>0}
function apply(name){const e=effects.find(e=>e.name===name);history.push({target:activeEditor,html:activeEditor.innerHTML});let prompt=e.prompt;for(const slot of e.slots){const v=reference[slot.reference];if(v)prompt=prompt.split(slot.token).join(v)}if(activeEditor.textContent.trim())activeEditor.append(document.createTextNode('\n'));for(const part of prompt.split(/(\{[^{}]+\})/g)){if(/^\{[^{}]+\}$/.test(part)){const mark=document.createElement('mark');mark.textContent='  ';mark.dataset.slot=part;mark.title=part+'：尚缺内容，请填写';activeEditor.append(mark)}else activeEditor.append(document.createTextNode(part))}sync();menu.hidden=true;document.querySelector('.more').setAttribute('aria-expanded','false');toast.hidden=false;document.querySelector('#toast-text').textContent='已追加；高亮处待填写';activeEditor.focus()}
document.querySelectorAll('[data-effect]').forEach(b=>b.onclick=()=>apply(b.dataset.effect));if(new URLSearchParams(location.search).has('apply')){const selected=JSON.parse(sessionStorage.getItem('nomi.mockup.selectedEffect')||'null');if(selected){effects.push(selected);apply(selected.name)}}document.querySelector('.more').onclick=e=>{activeEditor=editor;menu.hidden=!menu.hidden;e.currentTarget.setAttribute('aria-expanded',String(!menu.hidden))};document.querySelector('#filled-more').onclick=()=>{activeEditor=document.querySelector('#filled-editor');menu.hidden=false};document.querySelector('#undo').onclick=()=>{if(history.length){const before=history.pop();before.target.innerHTML=before.html;}sync();toast.hidden=true};editor.oninput=sync;document.querySelectorAll('.generate,.footer button').forEach(b=>b.onclick=()=>{toast.hidden=false;document.querySelector('#toast-text').textContent='仅交互样张，未调用生成服务'});document.querySelectorAll('.card').forEach(b=>b.onclick=()=>location.href='library-cards.html');document.querySelector('.search').oninput=e=>document.querySelectorAll('.card').forEach(b=>b.hidden=!b.textContent.includes(e.target.value));
</script></body></html>
