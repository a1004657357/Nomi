<!doctype html><html lang="zh-CN" data-mantine-color-scheme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nomi · 技能与提示词卡片样张</title><link rel="stylesheet" href="../../../../src/theme/nomi-tokens.css"><link rel="stylesheet" href="/tailwind.generated.css"><link rel="stylesheet" href="./style.css"><script src="./content.js"></script></head><body><main class="workspace"><aside class="sidebar"><div class="header"><strong>技能与提示词</strong><span class="wordmark">Nomi</span><span class="muted">55</span></div><div class="tabs"><button class="selected" data-tab="skills">技能库</button><button data-tab="prompts">提示词库</button></div><input class="search" aria-label="搜索技能或效果" placeholder="搜索技能或效果…"><div class="groups"><button class="active">全部</button><button>角色与场景</button><button>广告</button><button>修图</button></div><div class="grid"><button class="card" data-index="0"><img src="../../../../skills/curated-multi-view/assets/preview.jpg" alt="多视图设定的原仓产物"><div class="copy"><strong>多视图设定</strong><p>把同一主体整理成一致的多面设定。</p></div></button><button class="card" data-index="1"><img src="../../../../skills/curated-product-condensation/assets/preview.png" alt="凝露产品广告的原仓产物"><div class="copy"><strong>凝露产品广告</strong><p>用微距、水滴和环绕镜头展示产品质感。</p></div></button><button class="card" data-index="2"><img src="../../../../skills/curated-cross-view/assets/preview.jpg" alt="跨视角构图的原仓产物"><div class="copy"><strong>跨视角构图</strong><p>把参考画面转成另一机位，核对空间关系。</p></div></button><button class="card" data-index="3"><img src="../../../../skills/curated-coffee-pour/assets/preview.png" alt="咖啡倾注特写的原仓产物"><div class="copy"><strong>咖啡倾注特写</strong><p>把注入、油脂和蒸汽拆成清楚的镜头节拍。</p></div></button><button class="card" data-index="4"><img src="../../../../skills/curated-product-exploded-view/assets/preview.png" alt="产品爆炸视图的原仓产物"><div class="copy"><strong>产品爆炸视图</strong><p>让部件分离展示后归位，保持产品结构。</p></div></button><button class="card" data-index="5"><img src="../../../../skills/curated-outpaint/assets/preview.jpg" alt="自然扩图的原仓产物"><div class="copy"><strong>自然扩图</strong><p>补齐边缘空白，核对纹理与透视衔接。</p></div></button></div><div class="mode-note">原仓配图 · 完整来源可在详情查看。<br>新增插画尚待选定风格。</div></aside><section class="stage"><div class="node"><img src="../../../../skills/curated-multi-view/assets/preview.jpg" alt="多视图示例"></div></section><section class="detail" role="dialog" aria-modal="false" aria-label="技能详情"><div class="detail-head"><strong>技能详情</strong><button class="quiet" id="close" aria-label="关闭详情">×</button></div><div class="detail-body"><figure class="hero"><img id="detail-image" alt="原仓产物"><figcaption>原仓配图 · 完整图像不裁切<br>内容来自公开仓库，尚非 Nomi 本次生成验证。</figcaption></figure><div class="prompt-pane" id="detail-content"></div></div><div class="detail-footer"><span id="reference-state">引用方法，或把配方带到节点</span><button id="reference">引用到 Agent</button><button class="primary" id="use">用到节点</button></div></section></main><div class="toast" hidden role="status"></div><script>
const skillEntries=nomiMockupSkills;const effectEntries=nomiMockupEffects.filter(e=>['effect-character-three-view','effect-scene-three-view','effect-natural-texture','effect-fill-outpaint','effect-camera-04','effect-camera-13'].includes(e.name));let entries=skillEntries,selected=0;const detail=document.querySelector('.detail'),toast=document.querySelector('.toast');
function imageUrl(e){return e.preview?'../../../../skills/'+e.name+'/'+e.preview.path:'../../covers/anchors/anchor-3.png'}
function openEntry(i){selected=i;const e=entries[i];detail.hidden=false;window.nomiMockupSelected=e;window.dispatchEvent(new CustomEvent('nomi-mockup-detail',{detail:e}));document.querySelector('#detail-image').src=imageUrl(e);document.querySelector('.hero figcaption').textContent=e.preview?'原仓配图 · 完整图像不裁切；尚非 Nomi 本次生成验证。':'锚图候选 3 · 仅演示插画在卡片中的位置；不是此效果的产物或已批准封面。';}
function renderCards(){const grid=document.querySelector('.grid');grid.replaceChildren();entries.forEach((e,i)=>{const card=document.createElement('button');card.className='card';const img=document.createElement('img');img.src=imageUrl(e);img.alt=e.preview?'原仓产物':'待选锚图示意排版';const copy=document.createElement('div');copy.className='copy';const title=document.createElement('strong');title.textContent=e.title['zh-CN'];const summary=document.createElement('p');summary.textContent=e.summary['zh-CN'];copy.append(title,summary);card.append(img,copy);card.onclick=()=>openEntry(i);grid.append(card)});const groups=document.querySelector('.groups');groups.replaceChildren();['全部',...new Set(entries.map(e=>e.group['zh-CN']))].forEach(group=>{const b=document.createElement('button');b.textContent=group;b.classList.toggle('active',group==='全部');b.onclick=()=>{groups.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));grid.querySelectorAll('.card').forEach((card,i)=>card.hidden=group!=='全部'&&entries[i].group['zh-CN']!==group)};groups.append(b)})}
document.querySelector('#close').onclick=()=>detail.hidden=true;document.addEventListener('keydown',e=>{if(e.key==='Escape')detail.hidden=true});document.querySelector('.search').oninput=e=>document.querySelectorAll('.card').forEach((b,i)=>b.hidden=!JSON.stringify(entries[i]).includes(e.target.value));
document.querySelector('#reference').onclick=()=>{const e=entries[selected],state=document.querySelector('#reference-state');state.replaceChildren();const chip=document.createElement('span');chip.className='agent-chip';const img=document.createElement('img');img.src=imageUrl(e);chip.append(img,e.title['zh-CN']);chip.title='示例 Agent 引用；预览复用同一媒体';state.append(chip);toast.hidden=false;toast.textContent='已引用到示例 Agent（样张）'};document.querySelector('#use').onclick=()=>{sessionStorage.setItem('nomi.mockup.selectedEffect',JSON.stringify(entries[selected]));location.href='node-effects.html?apply=1'};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('selected',t===b));entries=b.dataset.tab==='prompts'?effectEntries:skillEntries;renderCards();openEntry(0)});renderCards();openEntry(0);

</script><script type="module" src="./capture-real.tsx"></script></body></html>
