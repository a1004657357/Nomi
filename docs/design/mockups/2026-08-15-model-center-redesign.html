    function render() {
      const settingsContent = document.querySelector('.settings-content');
      settingsContent.dataset.section = state.settingsSection;
      document.body.dataset.activeSettingsSection = state.settingsSection;
      document.querySelectorAll('[data-settings-section]').forEach(item => {
        if (item.dataset.settingsSection === state.settingsSection) item.setAttribute('aria-current', 'page');
        else item.removeAttribute('aria-current');
      });
      const mobileBack = document.querySelector('.mobile-back');
      if (mobileBack) {
        mobileBack.textContent = state.route === 'script' ? '‹ 返回模型' : state.route === 'model' ? '‹ 返回服务商' : state.route === 'add' ? '‹ 返回上一步' : '‹ 返回连接列表';
      }
      if (state.settingsSection === 'home') { renderSettingsHome(); return; }
      if (state.settingsSection !== 'models') { renderSimpleSettings(state.settingsSection); return; }
      renderConnectionList();
      if (state.scenario === 'empty' && state.route !== 'add') renderEmpty();
      else if (state.route === 'overview') renderOverview();
      else if (state.route === 'provider') renderProvider();
      else if (state.route === 'model') renderModelDetail();
      else if (state.route === 'add') renderAdd();
      else if (state.route === 'script') renderScript();
    }

    function modelViewKey() {
      return [state.route, state.selectedProvider, state.providerTab, state.selectedModel, state.selectedMode].join('::');
    }

    function rememberModelView() {
      if (state.settingsSection !== 'models') return;
      state.modelViewScroll[modelViewKey()] = {
        root: root.scrollTop,
        contract: root.querySelector('.contract-rail')?.scrollTop || 0,
        editor: root.querySelector('#code-editor')?.scrollTop || 0,
        add: root.querySelector('.add-scroll')?.scrollTop || 0
      };
    }

    function restoreModelView() {
      const snapshot = state.modelViewScroll[modelViewKey()];
      if (!snapshot) return;
      requestAnimationFrame(() => {
        root.scrollTop = snapshot.root;
        const contract = root.querySelector('.contract-rail');
        const editor = root.querySelector('#code-editor');
        const add = root.querySelector('.add-scroll');
        if (contract) contract.scrollTop = snapshot.contract;
        if (editor) editor.scrollTop = snapshot.editor;
        if (add) add.scrollTop = snapshot.add;
      });
    }

    function focusDetailSurface() {
      requestAnimationFrame(() => {
        const isMobile = window.matchMedia('(max-width: 760px)').matches;
        let target = root.querySelector('.detail-title');
        if (isMobile && state.settingsSection === 'models') {
          target = document.body.dataset.mobilePane === 'list'
            ? document.querySelector('.connection-head h1')
            : document.querySelector('.mobile-back');
        } else if (isMobile) {
          target = root.querySelector('.breadcrumb, .detail-title');
        }
        if (!target) return;
        if (!target.matches('button, input, select, textarea, [tabindex]')) target.setAttribute('tabindex', '-1');
        target.focus({ preventScroll: true });
      });
    }

    function closeSettings() {
      document.body.dataset.settingsOpen = 'false';
      requestAnimationFrame(() => document.querySelector('[data-action="reopen-settings"]')?.focus());
    }

    function reopenSettings() {
      document.body.dataset.settingsOpen = 'true';
      requestAnimationFrame(() => document.querySelector('[data-action="close-settings"]')?.focus());
    }

    function showSettingsSection(section) {
      rememberModelView();
      state.settingsSection = section;
      if (window.matchMedia('(max-width: 760px)').matches) document.body.dataset.mobilePane = section === 'models' ? 'list' : 'detail';
      render();
      if (section === 'models') restoreModelView();
      focusDetailSurface();
    }

    function navigateBack() {
      if (!window.matchMedia('(max-width: 760px)').matches) { closeSettings(); return; }
      if (state.settingsSection === 'home') { closeSettings(); return; }
      if (state.settingsSection !== 'models') { showSettingsSection('home'); return; }
      if (document.body.dataset.mobilePane === 'list') { showSettingsSection('home'); return; }
      if (state.route === 'script') { state.route = 'model'; render(); focusDetailSurface(); return; }
      if (state.route === 'model') { openProvider(state.selectedProvider, 'models'); return; }
      if (state.route === 'add') {
        if (state.addStage === 'select' && state.addContextual) { openProvider(state.selectedProvider, 'models'); return; }
        if (state.addStage !== 'methods') { state.addStage = 'methods'; state.addProvider = null; state.addMethod = null; render(); focusDetailSurface(); return; }
      }
      document.body.dataset.mobilePane = 'list';
      requestAnimationFrame(() => {
        const target = state.selectedProvider === 'all' ? document.querySelector('[data-route="overview"]') : document.querySelector(`[data-provider="${state.selectedProvider}"]`);
        target?.focus({ preventScroll: true });
      });
    }

    function createProviderFromForm() {
      const method = state.addMethod || 'api';
      const startedFromEmpty = state.scenario === 'empty';
      const fallbackName = method === 'script' ? '我的脚本 API' : method === 'bridge' ? '本地模型桥接' : method === 'curl' ? 'Example API' : '新的 API 连接';
      const name = document.getElementById('connection-name')?.value.trim() || fallbackName;
      const curlText = document.getElementById('curl-material')?.value || '';
      const curlUrl = curlText.match(/https?:\/\/[^\s'"\\]+/)?.[0];
      const baseUrl = method === 'bridge'
        ? document.getElementById('bridge-url')?.value.trim()
        : method === 'curl'
          ? curlUrl
          : document.getElementById('api-url')?.value.trim();
      state.newProviderSerial += 1;
      const id = `custom-${method}-${state.newProviderSerial}`;
      const provider = {
        id,
        name,
        short: name.replace(/\s+/g, '').slice(0, 2).toUpperCase() || '新',
        state: method === 'bridge' ? '桥接已保存' : '连接已保存',
        kind: method === 'bridge' ? 'local' : 'remote',
        baseUrl: baseUrl || '尚未填写',
        credential: method === 'bridge' ? '不需要' : '••••••••已保存'
      };
      if (startedFromEmpty) { providers = []; models = []; }
      providers.push(provider);
      state.scenario = 'normal';
      state.addProvider = id;
      state.selectedProvider = id;
      return provider;
    }

    function goDetail() {
      if (window.matchMedia('(max-width: 760px)').matches) document.body.dataset.mobilePane = 'detail';
    }

    function openProvider(providerId, tab = 'models') {
      state.selectedProvider = providerId;
      state.providerTab = tab;
      state.route = 'provider';
      render();
      goDetail();
      focusDetailSurface();
    }

    function openModel(modelId) {
      const model = modelById(modelId);
      if (!model) return;
      state.selectedModel = modelId;
      state.selectedProvider = model.provider;
      state.route = 'model';
      state.selectedMode = defaultModeForModel(model);
      render();
      goDetail();
      focusDetailSurface();
    }

    function startAdd(providerId = null, method = null) {
      state.route = 'add';
      state.selectedNewModels = new Set();
      state.selectedModelKinds = {};
      state.addProvider = providerId;
      state.addMethod = method;
      state.addContextual = Boolean(providerId);
      state.addStage = providerId ? 'select' : method ? 'connection' : 'methods';
      render();
      goDetail();
      focusDetailSurface();
    }

    document.addEventListener('click', event => {
      const menuToggle = event.target.closest('#prototype-menu-button');
      if (menuToggle) {
        const open = !menu.classList.contains('open');
        menu.classList.toggle('open', open);
        menuButton.setAttribute('aria-expanded', String(open));
        return;
      }
      if (!event.target.closest('#prototype-menu')) {
        menu.classList.remove('open');
        menuButton.setAttribute('aria-expanded', 'false');
      }

      const providerTarget = event.target.closest('[data-provider]');
      if (providerTarget && !providerTarget.matches('[data-action]')) {
        openProvider(providerTarget.dataset.provider);
        return;
      }

      const modelTarget = event.target.closest('[data-model]');
      if (modelTarget && !modelTarget.matches('[data-action]')) {
        openModel(modelTarget.dataset.model);
        return;
      }

      const routeTarget = event.target.closest('[data-route]');
      if (routeTarget) {
        if (routeTarget.dataset.route === 'overview') {
          state.route = 'overview'; state.selectedProvider = 'all'; render(); goDetail();
        }
        return;
      }

      const actionTarget = event.target.closest('[data-action]');
      if (!actionTarget) return;
      const action = actionTarget.dataset.action;

      if (action === 'start-add') startAdd();
      else if (action === 'start-add-api') startAdd(null, 'api');
      else if (action === 'start-add-script') startAdd(null, 'script');
      else if (action === 'add-to-provider') startAdd(actionTarget.dataset.provider);
      else if (action === 'cancel-add') {
        if (state.selectedProvider === 'all') { state.route = 'overview'; render(); focusDetailSurface(); }
        else openProvider(state.selectedProvider, 'models');
      }
      else if (action === 'back-add-methods') { state.addStage = 'methods'; state.addProvider = null; state.addMethod = null; state.addContextual = false; render(); focusDetailSurface(); }
      else if (action === 'open-tasks') openProvider('apimart', 'verification');
      else if (action === 'mobile-back') navigateBack();
      else if (action === 'settings-home') showSettingsSection('home');
      else if (action === 'close-settings') closeSettings();
      else if (action === 'reopen-settings') reopenSettings();
      else if (action === 'demo-setting') showToast('原型：该设置已响应，正式实现会调用对应的本地系统能力。');
      else if (action === 'help') showToast('帮助与反馈会打开独立帮助窗口，不占用设置内容页。');
      else if (action === 'show-empty') {
        menu.classList.remove('open'); menuButton.setAttribute('aria-expanded', 'false');
        state.scenario = 'empty'; state.route = 'empty'; state.selectedProvider = 'all'; render(); goDetail();
      }
      else if (action === 'restore-demo') {
        menu.classList.remove('open'); menuButton.setAttribute('aria-expanded', 'false');
        providers = demoProviders.map(provider => ({ ...provider }));
        models = demoModels.map(model => ({ ...model }));
        state.scenario = 'normal'; state.route = 'overview'; state.selectedProvider = 'all'; render(); goDetail();
      }
      else if (action === 'open-script') {
        const model = modelById(actionTarget.dataset.model || state.selectedModel);
        if (!model) return;
        state.selectedModel = model.id;
        state.selectedProvider = model.provider;
        ensureSelectedMode(model);
        state.route = 'script'; state.scriptTest = 'idle'; state.activeTest = null; render(); goDetail(); focusDetailSurface();
      }
      else if (action === 'revalidate') {
        const model = modelById(actionTarget.dataset.model);
        if (model) {
          model.lastEvent = null;
          if (model.status === 'verified') model.revalidating = true;
          else { model.status = 'running'; model.enabled = false; }
        }
        showToast('已开始重新验证；原调用继续保留，任务可在“验证”中重新打开。');
        render();
      }
      else if (action === 'stop-task') {
        const model = modelById(actionTarget.dataset.model || 'kling-v2-1');
        if (model) {
          if (model.revalidating) model.revalidating = false;
          else { model.status = 'attention'; model.enabled = false; }
          model.lastEvent = 'stopped';
        }
        showToast('已停止当前试跑。连接和已填写配置都已保留。');
        render();
      }
      else if (action === 'run-test') {
        const model = modelById(state.selectedModel);
        const key = scriptKey(model, state.selectedMode);
        const draft = document.getElementById('code-editor')?.value ?? state.scriptDrafts[key] ?? scriptForMode(model, state.selectedMode);
        state.scriptDrafts[key] = draft;
        const runId = `${Date.now()}-${Math.random()}`;
        state.activeTest = { runId, key, draft };
        state.scriptTest = 'running'; render();
        setTimeout(() => {
          if (state.activeTest?.runId !== runId) return;
          state.passedScripts[key] = draft;
          state.scriptTest = 'success';
          render();
          showToast('真实试跑通过，已验证当前这份脚本的产物。');
        }, 1050);
      }
      else if (action === 'save-script') {
        const model = modelById(state.selectedModel);
        const key = scriptKey(model, state.selectedMode);
        const draft = state.scriptDrafts[key] ?? scriptForMode(model, state.selectedMode);
        if (state.scriptTest !== 'success' || state.passedScripts[key] !== draft) return;
        if (model) { model.status = 'verified'; model.revalidating = false; model.enabled = true; model.lastEvent = null; }
        state.scriptSaved = true; state.route = 'model'; render(); showToast('调用脚本已保存并启用。');
      }
      else if (action === 'save-draft') showToast('已保存为未验证草稿；可以稍后继续，不会阻塞退出。');
      else if (action === 'force-enable') {
        const model = modelById(actionTarget.dataset.model);
        if (model) { model.enabled = true; state.pendingRiskEnable = null; }
        render(); showToast('模型已启用，并持续标记为“已启用但未验证”。');
      }
      else if (action === 'add-manual-id') {
        const input = document.getElementById('manual-model-id');
        const id = input && input.value.trim();
        if (!id) { showToast('请先填写 Model ID。'); return; }
        state.selectedNewModels.add(id);
        state.selectedModelKinds[id] = document.getElementById('manual-model-kind')?.value || '视频';
        render(); showToast(`已把 ${id} 加入本次选择。`);
      }
      else if (action === 'confirm-add') {
        const providerId = state.addProvider;
        if (!providerId || !providerById(providerId)) { showToast('请先建立或选择一个连接。'); return; }
        state.selectedNewModels.forEach(id => {
          const kind = state.selectedModelKinds[id] || (id.includes('image') ? '图片' : '视频');
          if (!modelById(id)) models.push({ id, name: id.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join(' '), provider: providerId, kind, modes: modeIdsByKind[kind]?.length || 1, status: 'pending', enabled: false });
        });
        state.selectedProvider = providerId; state.providerTab = 'verification'; state.route = 'provider';
        render(); showToast('新模型已保存；它们会分别配置，不影响已有模型。');
      }
      else if (action === 'continue-connection') {
        const provider = createProviderFromForm();
        if (state.addMethod === 'script') {
          const id = (document.getElementById('script-model-id')?.value || 'new-video-v1').trim();
          const kind = document.getElementById('script-model-kind')?.value || '视频';
          if (!modelById(id)) models.push({ id, name: id, provider: provider.id, kind, modes: modeIdsByKind[kind]?.length || 1, status: 'pending', enabled: false });
          state.selectedModel = id; state.selectedProvider = provider.id; state.selectedMode = defaultModeForModel(modelById(id)); state.route = 'script'; state.scriptTest = 'idle'; render(); focusDetailSurface();
        } else {
          state.addProvider = provider.id; state.addStage = 'select'; render(); showToast(`${provider.name} 已保存。现在可以选择模型；自动识别失败也可手填。`);
        }
      }
      else if (action === 'copy-url') showToast('API 地址已复制。');
      else if (action === 'recheck') showToast('连接检查通过；这不等于所有模型都已验证。');
      else if (action === 'edit-connection') showToast('原型：这里会在当前工作区展开连接编辑，不再弹出第二层窗口。');
      else if (action === 'disconnect') showToast('原型未执行断开；正式界面会先显示受影响的模型。');
    });

    document.addEventListener('change', event => {
      const toggle = event.target.closest('[data-toggle-model]');
      if (toggle) {
        const model = modelById(toggle.dataset.toggleModel);
        if (model && toggle.checked && model.status !== 'verified') {
          toggle.checked = false;
          state.pendingRiskEnable = model.id;
          openModel(model.id);
          showToast('这个模型尚未验证。请先试跑，或在模型详情明确选择“仍然启用”。');
        } else if (model) {
          model.enabled = toggle.checked;
          showToast(`${model.name} 已${model.enabled ? '启用' : '停用'}。`);
        }
      }

      const newModel = event.target.closest('[data-new-model]');
      if (newModel && !newModel.disabled) {
        if (newModel.checked) {
          state.selectedNewModels.add(newModel.dataset.newModel);
          state.selectedModelKinds[newModel.dataset.newModel] = newModel.dataset.modelKind || '视频';
        } else {
          state.selectedNewModels.delete(newModel.dataset.newModel);
          delete state.selectedModelKinds[newModel.dataset.newModel];
        }
        render();
      }

      if (event.target.id === 'script-mode-select') {
        state.selectedMode = event.target.value; state.scriptTest = 'idle'; state.activeTest = null; render();
      }
    });

    document.addEventListener('input', event => {
      if (event.target.id === 'provider-search' || event.target.matches('[data-model-search]')) {
        state.search = event.target.value;
        if (event.target.id === 'provider-search') renderConnectionList();
        else renderOverview();
      }
      if (event.target.id === 'code-editor') {
        state.scriptDrafts[event.target.dataset.scriptKey] = event.target.value;
        state.scriptTest = 'idle';
        state.activeTest = null;
        const saveButton = document.querySelector('[data-action="save-script"]');
        if (saveButton) saveButton.disabled = true;
        const testMarker = document.querySelector('.test-success, .test-running');
        if (testMarker) { testMarker.className = ''; testMarker.style.color = '#97968f'; testMarker.textContent = '脚本已修改 · 需要重新试跑'; }
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (menu.classList.contains('open')) {
        menu.classList.remove('open'); menuButton.setAttribute('aria-expanded', 'false'); menuButton.focus();
      } else if (document.body.dataset.settingsOpen !== 'false') navigateBack();
    });

    document.addEventListener('click', event => {
      const settingsSection = event.target.closest('[data-settings-section]');
      if (settingsSection) { showSettingsSection(settingsSection.dataset.settingsSection); return; }
      const segment = event.target.closest('[data-setting-segment]');
      if (segment) {
        segment.closest('.segmented')?.querySelectorAll('.segment').forEach(item => item.classList.toggle('active', item === segment));
        showToast(`${segment.textContent.trim()} 已选择。`);
      }
      const tab = event.target.closest('[data-provider-tab]');
      if (tab) {
        const tabId = tab.dataset.providerTab;
        state.providerTab = tabId; render();
        requestAnimationFrame(() => document.querySelector(`[data-provider-tab="${tabId}"]`)?.focus());
      }
      const mode = event.target.closest('[data-mode]');
      if (mode) { state.selectedMode = mode.dataset.mode; render(); }
      const reuse = event.target.closest('[data-reuse-provider]');
      if (reuse) { state.addProvider = reuse.dataset.reuseProvider; state.selectedProvider = reuse.dataset.reuseProvider; state.addStage = 'select'; state.addContextual = false; render(); }
      const method = event.target.closest('[data-add-method]');
      if (method) { state.addMethod = method.dataset.addMethod; state.addStage = 'connection'; render(); }
    });

    render();
  </script>
</body>
</html>
