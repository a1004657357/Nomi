<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nomi 模型与接入中心 · 交互原型</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f2ef;
      --paper: #ffffff;
      --paper-warm: #faf9f7;
      --ink: #282722;
      --ink-80: #45443e;
      --ink-60: #74716a;
      --ink-40: #a09d96;
      --line: #e3e1dc;
      --line-strong: #d4d1ca;
      --hover: #f1f0ed;
      --pressed: #eae8e3;
      --accent: #486fae;
      --accent-ink: #35598f;
      --accent-soft: #edf3fb;
      --success: #2d7b4f;
      --success-soft: #edf7f1;
      --warning: #9a6517;
      --warning-soft: #fff7e8;
      --danger: #b4473d;
      --danger-soft: #fff0ee;
      --shadow: 0 20px 60px rgba(34, 32, 27, 0.14), 0 2px 8px rgba(34, 32, 27, 0.08);
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      --settings-frame-height: 792px;
      --settings-frame-width: 1280px;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
      letter-spacing: 0;
    }

    body[data-active-settings-section="files"],
    body[data-active-settings-section="about"] { --settings-frame-height: 320px; --settings-frame-width: 960px; }
    body[data-active-settings-section="general"] { --settings-frame-height: 440px; --settings-frame-width: 1040px; }
    body[data-active-settings-section="ai"] { --settings-frame-height: 500px; --settings-frame-width: 1120px; }
    body[data-active-settings-section="automation"] { --settings-frame-height: 620px; --settings-frame-width: 1180px; }

    button, input, textarea, select { font: inherit; letter-spacing: 0; }

    button { color: inherit; }

    button, [role="button"] { -webkit-tap-highlight-color: transparent; }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent);
      outline-offset: 2px;
    }

    .settings-shell {
      width: min(var(--settings-frame-width), calc(100vw - 48px));
      height: min(var(--settings-frame-height), calc(100svh - 48px));
      min-height: 0;
      display: grid;
      grid-template-columns: 184px minmax(0, 1fr);
      align-self: start;
      margin-top: max(24px, calc((100svh - 792px) / 2));
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      box-shadow: var(--shadow);
      transition: width .18s ease, height .18s ease;
    }

    .settings-content {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
    }

    .settings-content:not([data-section="models"]) { grid-template-columns: minmax(0, 1fr); }
    .settings-content:not([data-section="models"]) .connection-pane { display: none; }

    .settings-nav {
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 20px 12px 14px;
      background: #eceae5;
      border-right: 1px solid var(--line-strong);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 22px;
      font-size: 15px;
      font-weight: 650;
    }

    .brand-copy { min-width: 0; flex: 1; white-space: nowrap; }

    .nav-close {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ink-60);
      cursor: pointer;
      font-size: 18px;
    }

    .nav-close:hover { background: rgba(255,255,255,.58); color: var(--ink); }

    .icon-button.mobile-list-close { display: none; }

    .brand-mark {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--ink);
      color: var(--paper);
      font-family: Georgia, serif;
      font-weight: 700;
    }

    .nav-label,
    .eyebrow {
      color: var(--ink-60);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
    }

    .nav-label { padding: 0 10px 7px; }

    .nav-list { display: grid; gap: 3px; }

    .nav-item {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 7px;
      padding: 0 10px;
      background: transparent;
      color: var(--ink-80);
      cursor: pointer;
      text-align: left;
    }

    .nav-item:hover { background: rgba(255,255,255,.54); }
    .nav-item[aria-current="page"] { background: var(--paper); color: var(--ink); font-weight: 600; }

    .nav-symbol {
      width: 18px;
      color: var(--ink-60);
      font-size: 15px;
      text-align: center;
    }

    .nav-spacer { flex: 1; }

    .version {
      padding: 12px 10px 0;
      border-top: 1px solid rgba(104,101,93,.16);
      color: var(--ink-40);
      font-size: 11px;
    }

    .connection-pane {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--paper-warm);
      border-right: 1px solid var(--line);
    }

    .connection-head {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 18px 14px 12px 16px;
    }

    .connection-head h1 {
      flex: 1;
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .mobile-settings-back { display: none; }

    .icon-button,
    .square-button {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--paper);
      cursor: pointer;
    }

    .icon-button:hover,
    .square-button:hover { background: var(--hover); }

    .plus-button {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
      font-size: 20px;
      line-height: 1;
    }

    .plus-button:hover { background: var(--ink-80); }

    .prototype-menu {
      position: absolute;
      z-index: 10;
      top: 58px;
      right: 14px;
      width: 172px;
      display: none;
      padding: 5px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(35,33,28,.14);
    }

    .prototype-menu.open { display: grid; }

    .menu-action {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      padding: 0 10px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .menu-action:hover { background: var(--hover); }

    .search-wrap { padding: 0 16px 12px; }

    .search-field {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 11px;
      background: var(--paper);
      color: var(--ink);
    }

    .search-field::placeholder { color: var(--ink-40); }

    .connection-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0 8px 12px;
    }

    .list-section-title {
      padding: 12px 9px 6px;
      color: var(--ink-60);
      font-size: 11px;
      font-weight: 600;
    }

    .connection-row {
      width: 100%;
      min-height: 58px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 7px;
      padding: 8px 9px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .connection-row:hover { background: var(--hover); }
    .connection-row.selected { background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }

    .provider-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper);
      color: var(--accent-ink);
      font-size: 12px;
      font-weight: 700;
    }

    .provider-icon.all { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .provider-icon.local { color: #28756d; }

    .row-title {
      overflow: hidden;
      color: var(--ink);
      font-size: 13px;
      font-weight: 580;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-subtitle {
      margin-top: 3px;
      overflow: hidden;
      color: var(--ink-60);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .connection-row .row-title,
    .connection-row .row-subtitle,
    .task-entry .row-title,
    .task-entry .row-subtitle,
    .choice-row .row-title,
    .choice-row .choice-id,
    .method-row .method-title,
    .method-row .method-copy { display: block; }

    .row-count { color: var(--ink-40); font-size: 12px; }

    .task-entry {
      margin: 0 10px 12px;
      min-height: 50px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 10px;
      background: var(--paper);
      cursor: pointer;
      text-align: left;
    }

    .task-entry:hover { border-color: var(--line-strong); background: var(--hover); }
    .task-entry .task-copy { flex: 1; min-width: 0; }

    .task-indicator {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .detail-pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }

    .mobile-detail-bar { display: none; }

    .mobile-bar-spacer { flex: 1; }

    #detail-root {
      min-height: 0;
      flex: 1;
      overflow: auto;
      container-type: inline-size;
    }

    .detail-view {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .detail-header {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
    }

    .detail-title-block { min-width: 0; flex: 1; }

    .detail-title {
      margin: 2px 0 0;
      overflow-wrap: anywhere;
      font-size: 20px;
      font-weight: 650;
      line-height: 1.25;
    }

    .detail-subtitle {
      margin-top: 5px;
      color: var(--ink-60);
      font-size: 12px;
      line-height: 1.45;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      padding: 7px 12px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 560;
      line-height: 1.2;
      cursor: pointer;
    }

    .button:hover { background: var(--hover); }
    .button:active { background: var(--pressed); }

    .button.primary { border-color: var(--ink); background: var(--ink); color: var(--paper); }
    .button.primary:hover { background: var(--ink-80); }
    .button.accent { border-color: var(--accent); background: var(--accent); color: var(--paper); }
    .button.accent:hover { background: var(--accent-ink); }
    .button.ghost { border-color: transparent; background: transparent; color: var(--ink-60); }
    .button.ghost:hover { background: var(--hover); color: var(--ink); }
    .button.danger-ghost { border-color: transparent; background: transparent; color: var(--danger); }
    .button.small { min-height: 32px; padding: 6px 10px; font-size: 12px; }
    .button:disabled { cursor: not-allowed; opacity: .42; }

    .content-pad { padding: 20px 24px 28px; }

    .overview-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }

    .stat {
      min-width: 0;
      padding: 15px 18px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child { border-right: 0; }
    .stat-number { font-size: 19px; font-weight: 650; }
    .stat-label { margin-top: 3px; color: var(--ink-60); font-size: 11px; }

    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .toolbar-row .search-field { max-width: 280px; }
    .toolbar-spacer { flex: 1; }

    .model-table {
      border-top: 1px solid var(--line);
    }

    .model-table-head,
    .model-row {
      display: grid;
      grid-template-columns: minmax(170px, 1.5fr) minmax(112px, .85fr) minmax(120px, 1fr) 58px 34px;
      align-items: center;
      gap: 10px;
    }

    .model-table-head {
      min-height: 36px;
      color: var(--ink-60);
      font-size: 11px;
      font-weight: 600;
    }

    .model-row {
      min-height: 62px;
      border-top: 1px solid var(--line);
      cursor: pointer;
    }

    .model-row:hover { background: var(--paper-warm); }
    .model-name { min-width: 0; }
    .model-name-button { width: 100%; border: 0; padding: 0; background: transparent; color: inherit; cursor: pointer; text-align: left; }
    .model-name strong { display: block; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .model-id { margin-top: 3px; overflow: hidden; color: var(--ink-60); font-family: var(--mono); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .cell-muted { min-width: 0; overflow: hidden; color: var(--ink-60); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }

    .state-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--ink-60);
      font-size: 12px;
      line-height: 1.35;
    }

    .state-label::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--ink-40);
    }

    .state-label.success { color: var(--success); }
    .state-label.success::before { background: var(--success); }
    .state-label.warning { color: var(--warning); }
    .state-label.warning::before { background: var(--warning); }
    .state-label.running { color: var(--accent-ink); }
    .state-label.running::before { background: var(--accent); }
    .state-label.neutral::before { background: var(--ink-60); }

    .switch {
      position: relative;
      width: 36px;
      height: 22px;
      display: inline-block;
      cursor: pointer;
    }

    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch-track { position: absolute; inset: 0; border-radius: 11px; background: var(--line-strong); transition: background .15s ease; }
    .switch-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.18); transition: transform .15s ease; }
    .switch input:checked + .switch-track { background: var(--accent); }
    .switch input:checked + .switch-track::after { transform: translateX(14px); }
    .switch input:focus-visible + .switch-track { outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent); outline-offset: 2px; }

    .tabs {
      min-height: 45px;
      display: flex;
      gap: 18px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      position: relative;
      border: 0;
      padding: 0 2px;
      background: transparent;
      color: var(--ink-60);
      cursor: pointer;
    }

    .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; }
    .tab[aria-selected="true"]::after { content: ""; position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: var(--ink); }

    .section-head {
      display: flex;
      align-items: start;
      gap: 12px;
      margin: 0 0 12px;
    }

    .section-head h2 { flex: 1; margin: 0; font-size: 14px; font-weight: 650; }
    .section-description { margin: -5px 0 14px; color: var(--ink-60); font-size: 12px; line-height: 1.55; }

    .info-list { border-top: 1px solid var(--line); }

    .info-row {
      min-height: 54px;
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--line);
    }

    .info-key { color: var(--ink-60); font-size: 12px; }
    .info-value { min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; }

    .settings-page-inner {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
      gap: 30px 32px;
      padding: 24px 28px 40px;
    }

    body[data-active-settings-section="ai"] .settings-page-inner {
      grid-template-columns: minmax(320px, 3fr) minmax(0, 5fr);
    }

    .settings-page-inner > .method-list { grid-column: 1 / -1; }

    .settings-page-section { min-width: 0; margin: 0; }
    .settings-page-section.wide { grid-column: 1 / -1; }
    .settings-page-section h2 { margin: 0 0 5px; font-size: 15px; }
    .settings-page-section > p { margin: 0 0 12px; color: var(--ink-60); font-size: 12px; line-height: 1.55; }

    .setting-row {
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      border-top: 1px solid var(--line);
    }

    .setting-row:last-child { border-bottom: 1px solid var(--line); }
    .setting-copy { min-width: 0; }
    .setting-copy strong { display: block; font-size: 13px; }
    .setting-copy span { display: block; margin-top: 3px; overflow-wrap: anywhere; color: var(--ink-60); font-size: 11px; line-height: 1.45; }
    .setting-control { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

    .settings-path {
      margin: 10px 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 12px;
      background: var(--paper-warm);
      color: var(--ink-60);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .settings-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .settings-option-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
    .settings-option { min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 42px; border-bottom: 1px solid var(--line); color: var(--ink-80); font-size: 12px; }
    .settings-option input { width: 16px; height: 16px; accent-color: var(--accent); }
    .settings-input { width: 132px; height: 34px; border: 1px solid var(--line-strong); border-radius: 7px; padding: 0 10px; color: var(--ink); background: var(--paper); }
    .locked-pill { display: inline-flex; align-items: center; min-height: 25px; border-radius: 999px; padding: 0 9px; background: var(--paper-warm); color: var(--ink-60); font-size: 10px; }

    .about-brand { display: flex; align-items: center; gap: 12px; min-height: 62px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .about-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--paper); font-weight: 700; }
    .about-brand strong { display: block; font-size: 15px; }
    .about-brand span { display: block; margin-top: 3px; color: var(--ink-60); font-size: 11px; }

    @container (max-width: 900px) {
      .settings-page-inner { grid-template-columns: minmax(0, 1fr); gap: 24px; }
      .settings-page-section.wide { grid-column: auto; }
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper-warm);
    }

    .segment {
      min-height: 30px;
      border: 0;
      border-radius: 5px;
      padding: 0 11px;
      background: transparent;
      color: var(--ink-60);
      cursor: pointer;
      font-size: 12px;
    }

    .segment.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(30,28,24,.1); font-weight: 600; }
    .mobile-only { display: none; }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-size: 12px;
      line-height: 1.55;
    }

    .notice.warning { border-color: var(--warning); background: var(--warning-soft); color: #785016; }
    .notice.success { border-color: var(--success); background: var(--success-soft); color: var(--success); }
    .notice.danger { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }

    .task-list { border-top: 1px solid var(--line); }

    .verification-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(145px, .9fr) auto;
      align-items: center;
      gap: 16px;
      min-height: 74px;
      border-bottom: 1px solid var(--line);
    }

    .verification-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }

    .mode-list { border-top: 1px solid var(--line); }

    .mode-row {
      width: 100%;
      min-height: 66px;
      display: grid;
      grid-template-columns: minmax(140px, .7fr) minmax(230px, 1.5fr) auto;
      align-items: center;
      gap: 16px;

        <div class="prototype-menu" id="prototype-menu" role="menu">
          <button class="menu-action" type="button" role="menuitem" data-action="show-empty">查看空账户状态</button>
          <button class="menu-action" type="button" role="menuitem" data-action="restore-demo">恢复示例数据</button>
        </div>
      </header>
      <div class="search-wrap"><label class="sr-only" for="provider-search">搜索连接</label><input class="search-field" id="provider-search" type="search" placeholder="搜索连接或模型" /></div>
      <div class="connection-list" id="connection-list"></div>
      <button class="task-entry" type="button" data-action="open-tasks">
        <span class="task-indicator" aria-hidden="true"></span>
        <span class="task-copy"><span class="row-title">后台接入任务</span><span class="row-subtitle" id="task-entry-copy">APIMart · 1 个模型检查中</span></span>
        <span aria-hidden="true">›</span>
      </button>
    </section>

    <section class="detail-pane" aria-label="模型详情工作区">
      <div class="mobile-detail-bar"><button class="mobile-back" type="button" data-action="mobile-back">‹ 返回连接列表</button><span class="mobile-bar-spacer"></span><button class="nav-close" type="button" data-action="close-settings" aria-label="关闭设置" title="关闭设置">×</button></div>
      <div id="detail-root" aria-live="polite"></div>
    </section>
    </div>
  </main>

  <section class="workbench-return" id="workbench-return" aria-label="Nomi 工作区">
    <header class="workbench-bar"><span class="brand-mark" aria-hidden="true">N</span><strong>未命名项目 · 画布</strong><button class="button primary" type="button" data-action="reopen-settings">重新打开模型设置</button></header>
    <div class="workbench-canvas" aria-label="创作画布"><div class="canvas-node one"><strong>提示词</strong><span>雨夜街头，镜头缓慢推进</span></div><div class="canvas-node two"><strong>图片生成</strong><span>等待连接模型</span></div><div class="canvas-node three"><strong>视频生成</strong><span>选择模式后开始</span></div></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"><span aria-hidden="true">✓</span><span id="toast-copy"></span></div>

  <script>
    let providers = [
      { id: 'apimart', name: 'APIMart', short: 'AP', state: '1 个需处理', kind: 'remote', baseUrl: 'https://api.apimart.ai/v1', credential: 'sk-live-••••••••7K2' },
      { id: 'openai', name: 'OpenAI', short: 'OA', state: '连接正常', kind: 'remote', baseUrl: 'https://api.openai.com/v1', credential: 'sk-proj-••••••••1A8' },
      { id: 'local', name: '本地工作流', short: '本', state: '本机可用', kind: 'local', baseUrl: 'http://127.0.0.1:8188', credential: '不需要' }
    ];

    let models = [
      { id: 'seedance-2-pro', name: 'Seedance 2.0 Pro', provider: 'apimart', kind: '视频', modes: 3, status: 'verified', enabled: true },
      { id: 'kling-v2-1', name: 'Kling v2.1', provider: 'apimart', kind: '视频', modes: 2, status: 'running', enabled: false },
      { id: 'veo-3', name: 'Veo 3', provider: 'apimart', kind: '视频', modes: 1, status: 'attention', enabled: false },
      { id: 'wan-2-2', name: 'Wan 2.2', provider: 'apimart', kind: '视频', modes: 2, status: 'unverified', enabled: false },
      { id: 'gpt-image-1', name: 'GPT Image 1', provider: 'openai', kind: '图片', modes: 2, status: 'verified', enabled: true },
      { id: 'gpt-4o-mini', name: 'GPT-4o mini', provider: 'openai', kind: '文本', modes: 1, status: 'verified', enabled: true },
      { id: 'flux-local', name: 'FLUX.1 Dev', provider: 'local', kind: '图片', modes: 2, status: 'verified', enabled: true },
      { id: 'comfy-video', name: 'AnimateDiff 工作流', provider: 'local', kind: '视频', modes: 1, status: 'unverified', enabled: false }
    ];

    const demoProviders = providers.map(provider => ({ ...provider }));
    const demoModels = models.map(model => ({ ...model }));

    const modeContracts = {
      'video-text': {
        kind: '视频',
        name: '文生视频',
        summary: '只需要提示词；不收集参考素材',
        required: [ ['prompt', '文本提示词'] ],
        optional: [ ['params.duration', '时长'], ['params.aspectRatio', '画幅'] ],
        limit: '不传入 references。模型不支持的参数不会出现在节点里。',
        result: '返回视频 URL，或返回 taskId 与查询函数。'
      },
      'video-frames': {
        kind: '视频',
        name: '首尾帧',
        summary: '首帧必需，尾帧可选；与其他模式独立',
        required: [ ['prompt', '文本提示词'], ['references.firstFrame', '首帧图片'] ],
        optional: [ ['references.lastFrame', '尾帧图片'], ['params.duration', '时长'] ],
        limit: '图片最多 2 张，位置语义固定为首帧和尾帧。',
        result: '返回视频 URL，或返回 taskId 与查询函数。'
      },
      'video-omni': {
        kind: '视频',
        name: '全能参考',
        summary: '1–4 张图片，可附加视频或音频参考',
        required: [ ['prompt', '文本提示词'], ['references.images[]', '参考图片，1–4 张'] ],
        optional: [ ['references.videos[]', '参考视频，最多 1 个'], ['references.audios[]', '参考音频，最多 1 个'], ['params.duration', '时长'] ],
        limit: '素材按数组传入，不把第 1、2 张图片强行解释为首尾帧。',
        result: '返回 video.url，或返回异步任务描述。Nomi 会验证产物确实可读取。'
      },
      'video-multi': {
        kind: '视频',
        name: '多参考图视频',
        summary: '2–7 张图片，保持主体或风格一致',
        required: [ ['prompt', '文本提示词'], ['references.images[]', '参考图片，2–7 张'] ],
        optional: [ ['params.referenceStrength', '参考强度'], ['params.aspectRatio', '画幅'] ],
        limit: '图片只有集合与顺序，不预设首帧、尾帧等角色。',
        result: '返回 video.url，或返回 taskId 与查询函数。'
      },
      'image-text': {
        kind: '图片',
        name: '文生图',
        summary: '提示词生成图片；不要求参考素材',
        required: [ ['prompt', '文本提示词'] ],
        optional: [ ['params.aspectRatio', '画幅'], ['params.count', '生成数量'] ],
        limit: '不传入 references；只有模型支持的图片参数会显示在节点中。',
        result: '返回 image.url / images[]，Nomi 会验证图片可读取和解码。'
      },
      'image-multi': {
        kind: '图片',
        name: '多图编辑',
        summary: '1–8 张输入图片，可表达主体、风格或局部编辑',
        required: [ ['prompt', '编辑要求'], ['references.images[]', '输入图片，1–8 张'] ],
        optional: [ ['references.mask', '蒙版；仅支持该槽位的模式出现'], ['params.strength', '编辑强度'] ],
        limit: '图片角色由当前模式契约声明；未声明 Mask 时界面不会要求用户提供。',
        result: '返回 image.url / images[]，Nomi 会校验实际图片产物。'
      },
      chat: {
        kind: '文本',
        name: '文本对话',
        summary: '消息与系统提示；不出现图片或视频模式',
        required: [ ['prompt', '当前用户消息'] ],
        optional: [ ['params.systemPrompt', '系统提示'], ['params.temperature', '随机度'], ['params.maxTokens', '最大输出长度'] ],
        limit: 'references 默认为空；只有模型显式支持多模态时才增加素材槽。',
        result: '返回 text，或返回可迭代的文本流。'
      },
      'audio-speech': {
        kind: '音频',
        name: '文本转语音',
        summary: '文本与音色参数生成音频',
        required: [ ['prompt', '要朗读的文本'] ],
        optional: [ ['params.voice', '音色'], ['params.speed', '语速'] ],
        limit: '不要求参考音频；克隆音色属于另一种模式。',
        result: '返回 audio.url / audioBytes，Nomi 会验证音频可读取。'
      },
      'audio-clone': {
        kind: '音频',
        name: '参考音色',
        summary: '文本加一段参考音频',
        required: [ ['prompt', '要朗读的文本'], ['references.audios[]', '参考音频，1 个'] ],
        optional: [ ['params.language', '语言'], ['params.speed', '语速'] ],
        limit: '只收集一段音频参考，不把图片或视频素材传给脚本。',
        result: '返回 audio.url / audioBytes，Nomi 会验证音频可读取。'
      }
    };

    const modeIdsByKind = {
      '视频': ['video-text', 'video-frames', 'video-omni', 'video-multi'],
      '图片': ['image-text', 'image-multi'],
      '文本': ['chat'],
      '音频': ['audio-speech', 'audio-clone']
    };

    const state = {
      settingsSection: 'models',
      route: 'overview',
      selectedProvider: 'all',
      providerTab: 'models',
      selectedModel: 'seedance-2-pro',
      selectedMode: 'video-omni',
      addStage: 'methods',
      addProvider: null,
      addMethod: null,
      addContextual: false,
      newProviderSerial: 0,
      selectedNewModels: new Set(),
      selectedModelKinds: {},
      scenario: 'normal',
      scriptTest: 'idle',
      scriptSaved: false,
      scriptDrafts: {},
      passedScripts: {},
      activeTest: null,
      pendingRiskEnable: null,
      search: '',
      modelViewScroll: {}
    };

    const statusMeta = {
      verified: ['已验证', 'success'],
      running: ['正在试跑', 'running'],
      attention: ['需要处理', 'warning'],
      unverified: ['尚未验证', 'neutral'],
      pending: ['调用待配置', 'neutral']
    };

    const root = document.getElementById('detail-root');
    const listRoot = document.getElementById('connection-list');
    const menu = document.getElementById('prototype-menu');
    const menuButton = document.getElementById('prototype-menu-button');
    const toast = document.getElementById('toast');
    const toastCopy = document.getElementById('toast-copy');
    let toastTimer = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }

    function providerById(id) { return providers.find(provider => provider.id === id); }
    function modelById(id) { return models.find(model => model.id === id); }

    function modeIdsForModel(model) {
      return modeIdsByKind[model?.kind] || ['video-text'];
    }

    function defaultModeForModel(model) {
      const ids = modeIdsForModel(model);
      if (model?.kind === '视频' && ids.includes('video-omni')) return 'video-omni';
      return ids[0];
    }

    function ensureSelectedMode(model) {
      const ids = modeIdsForModel(model);
      if (!ids.includes(state.selectedMode)) state.selectedMode = defaultModeForModel(model);
      return ids;
    }

    function providerName(id) {
      const provider = providerById(id);
      return provider ? provider.name : '未命名连接';
    }

    function showToast(message) {
      toastCopy.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function statusLabel(status, extra = '') {
      const [label, className] = statusMeta[status] || statusMeta.pending;
      return `<span class="state-label ${className}">${escapeHtml(extra || label)}</span>`;
    }

    function modelStatusLabel(model) {
      if (model.revalidating) return statusLabel('verified', '已验证 · 正在复检');
      if (model.status === 'running') return statusLabel('running', '自动配置中 · 已发送试跑');
      if (model.status === 'unverified' && model.enabled) return statusLabel('unverified', '已启用但未验证');
      return statusLabel(model.status);
    }

    function isTaskRunning(model) { return model.status === 'running' || Boolean(model.revalidating); }

    function countByStatus(status) { return models.filter(model => model.status === status).length; }

    function renderConnectionList() {
      const runningCount = models.filter(isTaskRunning).length;
      document.getElementById('task-entry-copy').textContent = `APIMart · ${runningCount} 个模型检查中`;
      if (state.scenario === 'empty') {
        listRoot.innerHTML = `
          <div class="list-section-title">模型</div>
          <button class="connection-row selected" type="button" data-route="empty">
            <span class="provider-icon all" aria-hidden="true">全</span>
            <span><span class="row-title">全部模型</span><span class="row-subtitle">还没有连接</span></span>
            <span class="row-count">0</span>
          </button>
          <div class="content-pad" style="padding:20px 9px;color:var(--ink-60);font-size:12px;line-height:1.6">连接建立后会一直保留在这里，可随时继续添加模型。</div>`;
        document.querySelector('.task-entry').style.display = 'none';
        return;
      }

      const query = state.search.trim().toLowerCase();
      const filteredProviders = providers.filter(provider => {
        if (!query) return true;
        return provider.name.toLowerCase().includes(query) || models.some(model => model.provider === provider.id && (model.name.toLowerCase().includes(query) || model.id.toLowerCase().includes(query)));
      });

      listRoot.innerHTML = `
        <div class="list-section-title">模型</div>
        <button class="connection-row ${state.selectedProvider === 'all' ? 'selected' : ''}" type="button" data-route="overview">
          <span class="provider-icon all" aria-hidden="true">全</span>
          <span><span class="row-title">全部模型</span><span class="row-subtitle">跨连接查看与启停</span></span>
          <span class="row-count">${models.length}</span>
        </button>
        <div class="list-section-title">已保存的连接</div>
        ${filteredProviders.map(provider => `
          <button class="connection-row ${state.selectedProvider === provider.id ? 'selected' : ''}" type="button" data-provider="${provider.id}">
            <span class="provider-icon ${provider.kind === 'local' ? 'local' : ''}" aria-hidden="true">${provider.short}</span>
            <span><span class="row-title">${provider.name}</span><span class="row-subtitle">${provider.state}</span></span>
            <span class="row-count">${models.filter(model => model.provider === provider.id).length}</span>
          </button>`).join('')}
        ${filteredProviders.length ? '' : '<div class="content-pad" style="padding:18px 10px;color:var(--ink-60);font-size:12px">没有匹配的连接或模型</div>'}`;
      document.querySelector('.task-entry').style.display = '';
    }

    function renderModelRows(modelList, showProvider = true) {
      return `
        <div class="model-table">
          <div class="model-table-head">
            <span>模型</span><span>${showProvider ? '连接' : '类型与模式'}</span><span>可用状态</span><span>启用</span><span></span>
          </div>
          ${modelList.map(model => `
            <div class="model-row" data-model-row="${model.id}">
              <button class="model-name model-name-button" type="button" data-model="${model.id}" aria-label="查看 ${escapeHtml(model.name)}"><strong>${escapeHtml(model.name)}</strong><span class="model-id" style="display:block">${escapeHtml(model.id)}</span></button>
              <div class="cell-muted provider-cell">${showProvider ? escapeHtml(providerName(model.provider)) : `${model.kind} · ${model.modes} 个模式`}</div>
              <div class="state-cell">${modelStatusLabel(model)}</div>
              <label class="switch" title="${model.enabled ? '停用模型' : '启用模型'}" onclick="event.stopPropagation()">
                <span class="sr-only">${model.enabled ? '停用' : '启用'} ${escapeHtml(model.name)}</span>
                <input type="checkbox" data-toggle-model="${model.id}" ${model.enabled ? 'checked' : ''} />
                <span class="switch-track"></span>
              </label>
              <button class="button ghost small row-more" type="button" data-model="${model.id}" aria-label="查看模型详情" title="查看模型详情">›</button>
            </div>`).join('')}
        </div>`;
    }

    function renderOverview() {
      const query = state.search.trim().toLowerCase();
      const visibleModels = models.filter(model => !query || model.name.toLowerCase().includes(query) || model.id.toLowerCase().includes(query) || providerName(model.provider).toLowerCase().includes(query));
      root.innerHTML = `
        <div class="detail-view">
          <header class="detail-header">
            <div class="detail-title-block"><div class="eyebrow">模型目录</div><h2 class="detail-title">全部模型</h2><div class="detail-subtitle">连接、调用配置和真实试跑分别记录，不再用一个“接入成功”概括全部状态。</div></div>
            <div class="header-actions"><button class="button primary" type="button" data-action="start-add"><span aria-hidden="true">＋</span>添加模型</button></div>
          </header>
          <div class="overview-stats" aria-label="模型状态汇总">
            <div class="stat"><div class="stat-number">${models.length}</div><div class="stat-label">已添加模型</div></div>
            <div class="stat"><div class="stat-number">${countByStatus('verified')}</div><div class="stat-label">已真实验证</div></div>
            <div class="stat"><div class="stat-number">${models.filter(isTaskRunning).length}</div><div class="stat-label">后台处理中</div></div>
            <div class="stat"><div class="stat-number">${countByStatus('attention')}</div><div class="stat-label">需要处理</div></div>
          </div>
          <div class="content-pad">
            <div class="toolbar-row"><input class="search-field" type="search" data-model-search placeholder="搜索模型 ID、名称或连接" value="${escapeHtml(state.search)}" /><span class="toolbar-spacer"></span><span class="state-label neutral">绿色只代表真实试跑通过</span></div>
            ${visibleModels.length ? renderModelRows(visibleModels, true) : '<div class="empty-state" style="min-height:360px"><div class="empty-symbol">⌕</div><h2>没有匹配的模型</h2><p>换一个关键词，或添加新的模型。</p></div>'}
          </div>
        </div>`;
    }

    function verificationSubtitle(model) {
      if (model.revalidating) return '正在试跑新候选 · 当前已验证调用继续可用';
      if (model.lastEvent === 'stopped') return '任务已停止 · 连接、脚本草稿和诊断现场均已保留';
      if (model.status === 'running') return model.id === 'kling-v2-1' ? '请求已发送 · 等待上游任务结果' : '正在使用独立任务尝试候选调用';
      if (model.status === 'verified') return model.id === 'seedance-2-pro' ? '产物可读取 · 1280 × 720 · 6.8 秒' : '真实产物已读取并校验';
      if (model.status === 'attention') return model.id === 'veo-3' ? '上游返回 422 · 缺少必填字段 image' : '自动配置未完成 · 已保留模型与现场';
      if (model.status === 'unverified') return '模型已保存 · 尚未做真实试跑';
      return '模型已保存 · 尚未修改任何已有模型';
    }

    function verificationActions(model) {
      if (model.revalidating) return `<button class="button ghost small" type="button" data-action="stop-task" data-model="${model.id}">停止复检</button>`;
      if (model.status === 'running') return `<button class="button small" type="button" data-action="open-script" data-model="${model.id}">换一种接法</button><button class="button ghost small" type="button" data-action="stop-task" data-model="${model.id}">停止</button>`;
      if (model.status === 'verified') return `<button class="button ghost small" type="button" data-model="${model.id}">查看证据</button><button class="button ghost small" type="button" data-action="revalidate" data-model="${model.id}">重新验证</button>`;
      if (model.status === 'attention') return `<button class="button small" type="button" data-action="open-script" data-model="${model.id}">修改调用</button>`;
      return `<button class="button small" type="button" data-action="open-script" data-model="${model.id}">配置调用</button><button class="button ghost small" type="button" data-action="revalidate" data-model="${model.id}">尝试自动配置</button>`;
    }

    function renderVerificationRows(providerModels) {
      const statusPriority = model => model.revalidating || model.status === 'running' ? 0 : model.status === 'pending' ? 1 : model.status === 'attention' ? 2 : model.status === 'unverified' ? 3 : 4;
      return [...providerModels]
        .sort((left, right) => statusPriority(left) - statusPriority(right))
        .map(model => `<div class="verification-row"><div><div class="row-title">${escapeHtml(model.name)}</div><div class="row-subtitle">${verificationSubtitle(model)}</div></div><div>${modelStatusLabel(model)}</div><div class="verification-actions">${verificationActions(model)}</div></div>`)
        .join('');
    }

    function renderProvider() {
      const provider = providerById(state.selectedProvider) || providers[0];
      const providerModels = models.filter(model => model.provider === provider.id);
      const tabs = [ ['models', '模型'], ['connection', '连接'], ['verification', '验证'] ];
      let content = '';

      if (state.providerTab === 'models') {
        content = `
          <div class="content-pad">
            <div class="section-head"><h2>${providerModels.length} 个模型</h2><button class="button small" type="button" data-action="add-to-provider" data-provider="${provider.id}"><span aria-hidden="true">＋</span>添加模型</button></div>
            <p class="section-description">继续添加会复用当前地址和凭证，只处理新选中的模型，不修改已有脚本、启用状态和路由。</p>
            ${renderModelRows(providerModels, false)}
          </div>`;
      } else if (state.providerTab === 'connection') {
        content = `
          <div class="content-pad">
            <div class="notice success"><span aria-hidden="true">✓</span><span><strong>连接已保存</strong><br />这只说明地址和凭证可用；每个模型的调用配置和试跑结果仍单独记录。</span></div>
            <div class="section-head"><h2>连接信息</h2><button class="button small" type="button" data-action="edit-connection">编辑</button></div>
            <div class="info-list">
              <div class="info-row"><span class="info-key">API 地址</span><span class="info-value">${escapeHtml(provider.baseUrl || '尚未填写')}</span><button class="button ghost small" type="button" data-action="copy-url">复制</button></div>
              <div class="info-row"><span class="info-key">凭证</span><span class="info-value">${escapeHtml(provider.credential || '已安全保存')}</span><button class="button ghost small" type="button" data-action="edit-connection">更换</button></div>
              <div class="info-row"><span class="info-key">鉴权方式</span><span class="info-value">${provider.kind === 'local' ? '本地桥接' : 'Authorization: Bearer'}</span><span></span></div>
              <div class="info-row"><span class="info-key">最近检查</span><span class="info-value" style="font-family:var(--font)">刚刚 · 模型列表可读取</span><button class="button small" type="button" data-action="recheck">重新检查</button></div>
            </div>
            <div style="margin-top:24px"><button class="button danger-ghost" type="button" data-action="disconnect">断开连接</button></div>
          </div>`;
      } else {
        content = `
          <div class="content-pad">
            <div class="notice"><span aria-hidden="true">↻</span><span><strong>任务在后台继续，但这里始终可以重新打开。</strong><br />每个模型独立结束；一个模型等待过久不会挡住其他模型。</span></div>
            <div class="section-head"><h2>当前与最近任务</h2><span class="state-label running">${providerModels.filter(isTaskRunning).length} 个检查中</span></div>
            <div class="task-list">
              ${renderVerificationRows(providerModels)}
            </div>
          </div>`;
      }

      root.innerHTML = `
        <div class="detail-view">
          <header class="detail-header">
            <div class="detail-title-block"><div class="eyebrow">已保存的连接</div><h2 class="detail-title">${provider.name}</h2><div class="detail-subtitle">连接已保存 · ${providerModels.filter(model => model.enabled).length} 个模型已启用</div></div>
            <div class="header-actions"><button class="button primary" type="button" data-action="add-to-provider" data-provider="${provider.id}"><span aria-hidden="true">＋</span>添加模型</button></div>
          </header>
          <div class="tabs" role="tablist" aria-label="${provider.name} 设置">
            ${tabs.map(([id, label]) => `<button class="tab" type="button" role="tab" data-provider-tab="${id}" aria-selected="${state.providerTab === id}">${label}</button>`).join('')}
          </div>
          ${content}
        </div>`;
    }

    function renderModelDetail() {
      const model = modelById(state.selectedModel) || models[0];
      const modes = ensureSelectedMode(model);
      const contract = modeContracts[state.selectedMode];
      const riskNotice = state.pendingRiskEnable === model.id
        ? `<div class="notice warning"><span aria-hidden="true">!</span><span style="flex:1"><strong>这个调用还没有真实试跑通过。</strong><br />推荐先验证；如果你明确接受生成时失败的风险，也可以保留“未验证”标记后启用。</span><button class="button small" type="button" data-action="force-enable" data-model="${model.id}">仍然启用</button></div>`
        : '';
      root.innerHTML = `
        <div class="detail-view">
          <header class="detail-header">
            <div class="detail-title-block">
              <button class="breadcrumb" type="button" data-provider="${model.provider}">‹ ${escapeHtml(providerName(model.provider))}</button>
              <h2 class="detail-title">${escapeHtml(model.name)}</h2>
              <div class="detail-subtitle">${escapeHtml(model.id)} · ${model.kind} · ${modelStatusLabel(model)}</div>
            </div>
            <div class="header-actions"><button class="button" type="button" data-action="revalidate" data-model="${model.id}">重新验证</button><button class="button primary" type="button" data-action="open-script" data-model="${model.id}">编辑调用</button></div>
          </header>
          <div class="content-pad">
            ${riskNotice}
            <div class="section-head"><h2>能力模式</h2><span class="state-label neutral">节点只显示所选模式需要的输入</span></div>
            <p class="section-description">模式负责描述 Nomi 要收集什么；调用脚本负责把这些输入翻译成该平台真正需要的请求。</p>
            <div class="mode-list">
              ${modes.map(id => {
                const mode = modeContracts[id];
                return `<button class="mode-row ${state.selectedMode === id ? 'active' : ''}" type="button" data-mode="${id}"><span class="mode-name">${mode.name}</span><span class="mode-contract-summary">${mode.summary}</span><span class="subtle-link">查看契约 ›</span></button>`;
              }).join('')}
            </div>
            <div class="mode-detail">
              <section><h3>必须提供</h3><p>${contract.required.map(item => `<code>${item[0]}</code><br />`).join('')}</p></section>
              <section><h3>可选输入</h3><p>${contract.optional.map(item => `<code>${item[0]}</code><br />`).join('') || '无'}</p></section>
              <section><h3>约束</h3><p>${contract.limit}</p></section>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="button" type="button" data-action="open-script" data-model="${model.id}">编辑“${contract.name}”的调用方式</button></div>
          </div>
        </div>`;
    }

    function stepClass(step) {
      const order = ['methods', 'connection', 'select', 'workspace'];
      const current = order.indexOf(state.addStage);
      const target = order.indexOf(step);
      if (current === target) return 'active';
      if (target < current) return 'done';
      return '';
    }

    function renderAddSteps() {
      return `<aside class="add-steps" aria-label="添加模型步骤">
        <div class="step ${stepClass('methods')}"><span class="step-number">${stepClass('methods') === 'done' ? '✓' : '1'}</span><span>选择接入方式</span></div>
        <div class="step ${stepClass('connection')}"><span class="step-number">${stepClass('connection') === 'done' ? '✓' : '2'}</span><span>建立或复用连接</span></div>
        <div class="step ${stepClass('select')}"><span class="step-number">${stepClass('select') === 'done' ? '✓' : '3'}</span><span>选择模型</span></div>
      </aside>`;
    }

    function renderAddMethods() {
      return `
        <div class="add-scroll">
        <div class="method-group"><h2>复用已保存的连接</h2><div class="method-list">
          ${providers.map(provider => `<button class="method-row" type="button" data-reuse-provider="${provider.id}"><span class="provider-icon ${provider.kind === 'local' ? 'local' : ''}">${provider.short}</span><span><span class="method-title">${provider.name}</span><span class="method-copy">凭证已保存 · 已有 ${models.filter(model => model.provider === provider.id).length} 个模型</span></span><span aria-hidden="true">›</span></button>`).join('')}
        </div></div>
        <div class="method-group"><h2>建立新的接入</h2><div class="method-list">
          <button class="method-row" type="button" data-add-method="api"><span class="method-symbol">↗</span><span><span class="method-title">API 地址与 Key</span><span class="method-copy">兼容常见 HTTP API；无法识别文档时仍可继续手填模型 ID</span></span><span aria-hidden="true">›</span></button>
          <button class="method-row" type="button" data-add-method="curl"><span class="method-symbol">{ }</span><span><span class="method-title">cURL / OpenAPI / 请求样例</span><span class="method-copy">从真实请求提取鉴权、参数和结果位置</span></span><span aria-hidden="true">›</span></button>
          <button class="method-row" type="button" data-add-method="script"><span class="method-symbol">&lt;/&gt;</span><span><span class="method-title">我已有调用脚本</span><span class="method-copy">填写模型 ID 后直接进入脚本工作区，不必先等自动识别失败</span></span><span aria-hidden="true">›</span></button>
          <button class="method-row" type="button" data-add-method="bridge"><span class="method-symbol">⌘</span><span><span class="method-title">本地工作流 / SDK 桥接</span><span class="method-copy">用于 ComfyUI、登录态 SDK、WebSocket 或常驻任务</span></span><span aria-hidden="true">›</span></button>
        </div></div></div>`;
    }

    function renderConnectionForm() {
      const isScript = state.addMethod === 'script';
      const isBridge = state.addMethod === 'bridge';
      const isCurl = state.addMethod === 'curl';
      const defaultName = isScript ? '我的脚本 API' : isBridge ? '本地模型桥接' : isCurl ? 'Example API' : '新的 API 连接';
      return `
        <div class="add-scroll">
        <div class="section-head"><h2>${isScript ? '先标记这个模型' : isBridge ? '连接本地桥接' : isCurl ? '粘贴一份真实调用' : '保存 API 连接'}</h2></div>
        <p class="section-description">${isScript ? '不要求先有文档。模型 ID 和类型足够让你进入脚本工作区。' : isBridge ? '桥接进程负责 SDK、登录态、WebSocket 和常驻任务；Nomi 只与本地稳定协议通信。' : isCurl ? '敏感值会在预览中脱敏。解析失败也不会阻塞手动配置。' : '地址和凭证先独立保存；读取不到文档或模型列表时仍可继续。'}</p>
        <label class="field-label" for="connection-name">连接名称</label>
        <input class="search-field" id="connection-name" value="${defaultName}" />
        <div style="height:14px"></div>
        ${isCurl ? `
          <label class="field-label" for="curl-material">cURL / OpenAPI 片段</label>
          <textarea class="search-field" id="curl-material" style="height:180px;padding:10px;resize:vertical" spellcheck="false">curl -X POST https://api.example.com/v1/videos \\
  -H 'Authorization: Bearer $API_KEY' \\
  -d '{"model":"new-video-v1","prompt":"..."}'</textarea>
        ` : isBridge ? `
          <label class="field-label" for="bridge-url">本地桥接地址</label>
          <input class="search-field" id="bridge-url" value="http://127.0.0.1:47821" />
          <div class="notice" style="margin-top:14px"><span>i</span><span>桥接未运行时仍可保存草稿；启动后再检查，不会丢失已填内容。</span></div>
        ` : `
          <label class="field-label" for="api-url">${isScript ? 'API 根地址（可稍后补）' : 'API 根地址'}</label>
          <input class="search-field" id="api-url" value="${isScript ? '' : 'https://api.example.com/v1'}" placeholder="https://api.example.com/v1" />
          <div style="height:14px"></div>
          <label class="field-label" for="api-key">API Key</label>
          <input class="search-field" id="api-key" type="password" value="example-secret-key" />
          ${isScript ? `<div style="height:14px"></div><label class="field-label" for="script-model-id">模型 ID</label><input class="search-field" id="script-model-id" value="new-video-v1" /><div style="height:14px"></div><label class="field-label" for="script-model-kind">模型类型</label><select class="mode-select" id="script-model-kind" style="width:100%"><option>视频</option><option>图片</option><option>文本</option><option>音频</option></select>` : ''}
        `}</div>
        <div class="add-footer"><button class="button ghost" type="button" data-action="back-add-methods">返回</button><span class="toolbar-spacer"></span><button class="button primary" type="button" data-action="continue-connection">${isScript ? '进入脚本工作区' : isBridge ? '保存并检查桥接' : isCurl ? '解析并继续' : '保存连接并继续'}</button></div>`;
    }

    function renderModelSelection() {
      const provider = providerById(state.addProvider) || providers[0];
      const existingCandidates = models.filter(model => model.provider === provider.id).map(model => ({ id: model.id, name: model.name, existing: true, kind: model.kind }));
      const suggestedByProvider = provider.id === 'apimart'
        ? [ { id: 'seedance-2-1-fast', name: 'Seedance 2.1 Fast', kind: '视频' }, { id: 'kling-v3', name: 'Kling v3', kind: '视频' }, { id: 'image-gen-4', name: 'Image Gen 4', kind: '图片' } ]
        : provider.id === 'openai'
          ? [ { id: 'sora-2', name: 'Sora 2', kind: '视频' }, { id: 'gpt-audio-mini', name: 'GPT Audio mini', kind: '音频' } ]
          : provider.kind === 'local'
            ? [ { id: 'workflow-new', name: '新工作流', kind: '视频' }, { id: 'local-image-pipeline', name: '本地图像流程', kind: '图片' } ]
            : [ { id: 'new-video-v1', name: 'New Video v1', kind: '视频' }, { id: 'new-image-v1', name: 'New Image v1', kind: '图片' } ];
      const existingIds = new Set(existingCandidates.map(candidate => candidate.id));
      const candidates = [...existingCandidates, ...suggestedByProvider.filter(candidate => !existingIds.has(candidate.id)).map(candidate => ({ ...candidate, existing: false }))];
      const selectedCount = state.selectedNewModels.size;
      return `
        <div class="add-scroll">
        <div class="connection-summary"><span class="provider-icon">${provider.short}</span><span><span class="row-title">${provider.name}</span><span class="row-subtitle">连接已保存 · 复用现有地址与凭证</span></span><button class="button ghost small" type="button" data-action="back-add-methods">更换</button></div>
        <div class="notice"><span aria-hidden="true">i</span><span>已有模型不会被重新处理。只会为本次新选中的模型建立独立任务。</span></div>
        <div class="section-head"><h2>选择要添加的模型</h2><span class="state-label neutral">已找到 ${candidates.length} 个</span></div>
        <div class="choice-list">
          ${candidates.map(candidate => `<label class="choice-row ${candidate.existing ? 'disabled' : ''}">
            <input type="checkbox" data-new-model="${candidate.id}" data-model-kind="${candidate.kind}" ${candidate.existing ? 'checked disabled' : ''} ${state.selectedNewModels.has(candidate.id) ? 'checked' : ''} />
            <span><span class="row-title">${candidate.name}</span><span class="choice-id">${candidate.id} · ${candidate.kind}</span></span>
            <span class="already-added">${candidate.existing ? '已添加' : ''}</span>
          </label>`).join('')}
        </div>
        <div class="manual-entry">
          <label class="field-label" for="manual-model-id">列表里没有？直接填写 Model ID</label>
          <div class="field-row"><input class="search-field" id="manual-model-id" placeholder="例如 new-video-model-v1" /><select class="mode-select" id="manual-model-kind" aria-label="模型类型"><option>视频</option><option>图片</option><option>文本</option><option>音频</option></select><button class="button" type="button" data-action="add-manual-id">加入列表</button></div>
          <div class="detail-subtitle">即使没有文档，仍可先保存模型，再用 cURL 或调用脚本完成配置。</div>
        </div></div>
        <div class="add-footer"><button class="button ghost" type="button" data-action="${state.addContextual ? 'cancel-add' : 'back-add-methods'}">${state.addContextual ? `返回 ${escapeHtml(provider.name)}` : '返回'}</button><span class="toolbar-spacer"></span><button class="button primary" type="button" data-action="confirm-add" ${selectedCount ? '' : 'disabled'}>添加 ${selectedCount || ''} 个新模型</button></div>`;
    }

    function renderAdd() {
      let inner = '';
      if (state.addStage === 'methods') inner = renderAddMethods();
      else if (state.addStage === 'connection') inner = renderConnectionForm();
      else inner = renderModelSelection();

      const title = state.addStage === 'methods' ? '添加模型' : state.addStage === 'select' ? '选择模型' : '建立连接';
      const subtitle = state.addStage === 'methods' ? '从你手里已有的材料开始；自动识别是帮助，不是门槛。' : state.addStage === 'select' ? '已添加模型保持不变，新模型分别进入接入工作区。' : '任何一步失败都可以保存草稿或换一种接法。';
      root.innerHTML = `
        <div class="detail-view add-view">
          <header class="detail-header"><div class="detail-title-block"><button class="breadcrumb" type="button" data-action="cancel-add">‹ 模型与接入</button><h2 class="detail-title">${title}</h2><div class="detail-subtitle">${subtitle}</div></div></header>
          <div class="add-layout">${renderAddSteps()}<div class="add-main">${inner}</div></div>
        </div>`;
    }

    function contractItems(items, required = false) {
      return items.map(([name, note]) => `<div class="contract-item ${required ? 'required' : ''}"><code>${escapeHtml(name)}</code><div class="contract-note">${escapeHtml(note)}</div></div>`).join('');
    }

    function scriptKey(model, mode) { return `${model.provider}::${model.id}::${mode}`; }

    function scriptForMode(model, mode) {
      if (model.kind === '文本') return `const response = await http.post('/chat/completions', {
  model: config.modelId,
  messages: [
    { role: 'system', content: params.systemPrompt },
    { role: 'user', content: prompt },
  ],
  temperature: params.temperature,
})

return { text: response.choices[0].message.content }`;

      if (model.kind === '图片') {
        const referencesLine = mode === 'image-multi' ? `images: references.images.map(asset => asset.url),\n  mask: references.mask?.url,` : '';
        return `const result = await http.post('/images/generations', {
  model: config.modelId,
  prompt,
  ${referencesLine}
  aspect_ratio: params.aspectRatio,
})

return { image: { url: result.data?.[0]?.url ?? result.url } }`;
      }

      if (model.kind === '音频') {
        const referenceLine = mode === 'audio-clone' ? `reference_audio: references.audios[0].url,` : '';
        return `const result = await http.post('/audio/speech', {
  model: config.modelId,
  input: prompt,
  voice: params.voice,
  ${referenceLine}
})

return { audio: { url: result.audio_url } }`;
      }

      const referencesLine = mode === 'video-frames'
        ? `first_frame: references.firstFrame?.url,\n  last_frame: references.lastFrame?.url,`
        : mode === 'video-text'
          ? ''
          : `images: references.images.map(asset => asset.url),\n  video: references.videos?.[0]?.url,\n  audio: references.audios?.[0]?.url,`;
      return `const created = await http.post('/video/generations', {
  model: config.modelId,
  prompt,
  ${referencesLine}
  duration: params.duration,
  aspect_ratio: params.aspectRatio,
})

return {
  taskId: created.id,
  async query() {
    const task = await http.get('/video/generations/' + created.id)
    if (task.status === 'succeeded') return { video: { url: task.video_url } }
    if (task.status === 'failed') throw new Error(task.error)
    return null
  },
}`;
    }

    function renderScript() {
      const model = modelById(state.selectedModel) || models[0];
      const availableModes = ensureSelectedMode(model);
      const contract = modeContracts[state.selectedMode];
      const key = scriptKey(model, state.selectedMode);
      const draft = state.scriptDrafts[key] ?? scriptForMode(model, state.selectedMode);
      const assetLabel = model.kind === '文本' ? '文本' : model.kind;
      const endpoint = model.kind === '文本' ? '/chat/completions' : model.kind === '图片' ? '/images/generations' : model.kind === '音频' ? '/audio/speech' : '/video/generations';
      const testStatus = state.scriptTest === 'running'
        ? '<span class="test-running">正在发送真实试跑…</span>'
        : state.scriptTest === 'success'
          ? `<span class="test-success">✓ 试跑通过 · ${assetLabel}${model.kind === '文本' ? '已返回' : '可读取'} · 6.8 秒</span>`
          : '<span style="color:#97968f">尚未试跑</span>';
      const transcript = state.scriptTest === 'idle'
        ? '点击“试跑”后，这里会显示脱敏请求、响应、轮询与产物校验。'
        : state.scriptTest === 'running'
          ? `POST ${endpoint}  →  request accepted\nrun: run_9f8c2\nstatus: processing`
          : model.kind === '文本'
            ? `POST ${endpoint}  →  200 OK\n✓ 返回结构校验通过\ntext: “这是本次真实试跑的文本结果…”`
            : `POST ${endpoint}  →  accepted\nrun: run_9f8c2\nstatus: succeeded\nGET https://cdn.example/result  →  200\n✓ ${assetLabel}产物读取与解码通过`;
      const passedCurrentDraft = state.scriptTest === 'success' && state.passedScripts[key] === draft;
      const saveDisabled = passedCurrentDraft ? '' : 'disabled';

      root.innerHTML = `
        <div class="detail-view script-view">
          <header class="script-header">
            <div class="detail-title-block"><button class="breadcrumb" type="button" data-model="${model.id}">‹ ${escapeHtml(model.name)}</button><h2 class="detail-title">编辑调用</h2><div class="detail-subtitle">当前模式的输入契约会随模式切换，不写死成首尾帧。</div></div>
            <label><span class="sr-only">选择能力模式</span><select class="mode-select" id="script-mode-select">${availableModes.map(id => `<option value="${id}" ${state.selectedMode === id ? 'selected' : ''}>${modeContracts[id].name}</option>`).join('')}</select></label>
            <div class="header-actions"><button class="button" type="button" data-action="run-test">▶ 试跑</button><span title="${saveDisabled ? '请先完成一次真实试跑；也可以保存为未验证草稿' : '保存并让此调用投入生产'}"><button class="button primary" type="button" data-action="save-script" ${saveDisabled}>保存并启用</button></span></div>
          </header>
          <div class="script-workspace">
            <aside class="contract-rail" aria-label="当前模式契约">
              <details class="mobile-contract-summary"><summary>${contract.name} · 输入与返回契约</summary><div><strong>必须：</strong>${contract.required.map(item => `<code>${item[0]}</code>`).join(' · ')}</div><div><strong>可选：</strong>${contract.optional.map(item => `<code>${item[0]}</code>`).join(' · ') || '无'}</div><div><strong>返回：</strong>${contract.result}</div></details>
              <div class="contract-section"><h2>当前模式</h2><div class="contract-item required"><strong>${contract.name}</strong><div class="contract-note">${contract.summary}</div></div></div>
              <div class="contract-section"><h2>必须提供</h2><div class="contract-list">${contractItems(contract.required, true)}</div></div>
              <div class="contract-section"><h2>可选输入</h2><div class="contract-list">${contractItems(contract.optional)}</div></div>
              <div class="contract-section"><h2>稳定可用变量</h2><div class="contract-list">${contractItems([['prompt', '提示词'], ['params', '当前模式参数'], ['references', '按契约收集的素材'], ['config', '模型与连接信息']])}</div></div>
              <div class="contract-section"><h2>素材约束</h2><div class="contract-item">${contract.limit}</div></div>
              <div class="contract-section"><h2>必须返回</h2><div class="contract-item required">${contract.result}</div></div>
            </aside>
            <section class="editor-side" aria-label="调用脚本编辑器">
