<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nomi 剪辑节点交互方案</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(0.18 0.006 80);
      --paper: oklch(0.235 0.007 80);
      --paper-raised: oklch(0.275 0.008 80);
      --ink: oklch(0.93 0.006 85);
      --ink-80: oklch(0.84 0.006 85);
      --ink-60: oklch(0.70 0.006 85);
      --ink-40: oklch(0.62 0.006 85);
      --ink-20: oklch(0.42 0.006 85);
      --ink-10: oklch(0.34 0.006 85);
      --line: oklch(0.36 0.007 80);
      --line-soft: oklch(0.31 0.007 80);
      --accent: oklch(0.70 0.13 250);
      --accent-soft: color-mix(in srgb, var(--accent) 26%, var(--paper));
      --video: oklch(0.70 0.13 150);
      --image: oklch(0.72 0.13 200);
      --danger: oklch(0.72 0.16 25);
      --warning: oklch(0.78 0.13 75);
      --shadow: 0 18px 50px oklch(0 0 0 / .34);
      --radius-sm: 6px;
      --radius: 10px;
      --fast: 140ms cubic-bezier(.2, .7, .3, 1);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--bg); color: var(--ink); font: 13px/1.45 "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, [role="button"]:focus-visible, input:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
    button:disabled { color: var(--ink-40); cursor: not-allowed; }
    [hidden] { display: none !important; }

    .appbar { height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 0 18px; border-bottom: 1px solid var(--line-soft); background: color-mix(in srgb, var(--paper) 82%, transparent); backdrop-filter: blur(18px); position: relative; z-index: 30; }
    .brandline, .app-actions, .modes { display: flex; align-items: center; }
    .brandline { gap: 12px; min-width: 0; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--bg); font-weight: 800; }
    .brand-name { font: 22px Georgia, serif; color: var(--ink); }
    .brand-name b { color: var(--accent); font-weight: 500; }
    .crumb { min-width: 0; max-width: 300px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--ink-60); }
    .crumb strong { overflow: hidden; color: var(--ink-80); text-overflow: ellipsis; white-space: nowrap; }
    .modes { gap: 2px; padding: 4px; border-radius: 999px; background: var(--ink-10); }
    .mode { min-width: 62px; height: 34px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-60); }
    .mode[aria-pressed="true"] { background: var(--paper-raised); color: var(--ink); box-shadow: 0 1px 3px oklch(0 0 0 / .25); }
    .app-actions { justify-self: end; gap: 8px; }
    .icon-button, .tool-button { display: inline-grid; place-items: center; border: 1px solid transparent; background: transparent; cursor: pointer; transition: background var(--fast), color var(--fast), border-color var(--fast); }
    .icon-button { width: 40px; height: 40px; border-radius: 999px; color: var(--ink-60); font-size: 16px; }
    .icon-button:hover, .tool-button:hover { background: var(--ink-10); color: var(--ink); }
    .launch { background: var(--ink); color: var(--bg); }

    .workspace { position: relative; height: calc(100vh - 64px); min-height: 620px; }
    .toolrail { position: absolute; inset: 0 auto 0 0; z-index: 18; width: 68px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 18px; border-right: 1px solid var(--line-soft); background: color-mix(in srgb, var(--paper) 70%, transparent); }
    .tool-button { width: 46px; min-height: 46px; border-radius: var(--radius-sm); color: var(--ink-60); }
    .tool-button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    .canvas { position: absolute; inset: 0 0 0 68px; overflow: auto; background-color: var(--bg); background-image: radial-gradient(circle, color-mix(in srgb, var(--ink) 18%, transparent) 1.4px, transparent 1.4px); background-size: 32px 32px; }
    .canvas-stage { position: relative; width: max(100%, 1360px); min-height: max(100%, 840px); }
    .edge-layer { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    .edge { fill: none; stroke: color-mix(in srgb, var(--accent) 48%, var(--line)); stroke-width: 2; }
    .edge.output { stroke: var(--accent); stroke-width: 2.2; }
    .edge-dot { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
    .zoom-tools { position: sticky; left: 18px; top: calc(100% - 58px); z-index: 20; width: max-content; display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); }

    .node { position: absolute; z-index: 4; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: 0 2px 8px oklch(0 0 0 / .24); }
    .source-node { left: 90px; width: 230px; height: 150px; overflow: hidden; }
    #sourceA { top: 130px; }
    #sourceB { top: 330px; }
    .source-media { width: 100%; height: 112px; display: block; object-fit: cover; background: var(--ink-10); }
    .source-title { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--ink-80); }
    .kind-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--image); box-shadow: 0 0 0 3px color-mix(in srgb, var(--image) 15%, transparent); }
    .kind-dot.video { background: var(--video); box-shadow: 0 0 0 3px color-mix(in srgb, var(--video) 15%, transparent); }
    .port { position: absolute; top: 50%; width: 12px; height: 12px; border: 2px solid var(--line); border-radius: 999px; background: var(--paper); transform: translateY(-50%); }
    .port.in { left: -7px; }
    .port.out { right: -7px; }

    .clip-node { left: 390px; top: 545px; z-index: 8; width: 620px; height: 164px; overflow: visible; border-color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), var(--shadow); transition: height var(--fast); }
    .clip-shell { height: 100%; overflow: hidden; border-radius: var(--radius); background: var(--paper); }
    .node-head { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; border-bottom: 1px solid var(--line-soft); }
    .node-head .title { font-size: 14px; font-weight: 650; }
    .scissors { color: var(--accent); font-size: 15px; }
    .node-meta { color: var(--ink-60); font-size: 11px; }
    .node-head #clipCount { margin-left: auto; }
    .primary-button, .secondary-button, .danger-button { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; cursor: pointer; transition: background var(--fast), border-color var(--fast), color var(--fast); }
    .primary-button { border-color: var(--ink); background: var(--ink); color: var(--bg); font-weight: 650; }
    .primary-button:hover { border-color: var(--accent); background: var(--accent); color: var(--bg); }
    .secondary-button { background: var(--paper-raised); color: var(--ink-80); }
    .secondary-button:hover { border-color: var(--accent); color: var(--accent); }
    .danger-button { background: transparent; color: var(--danger); }
    .danger-button:hover { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--paper)); }
    .export-trigger { width: 32px; min-height: 32px; padding: 0; border-radius: var(--radius-sm); }

    .timeline { height: 122px; padding: 8px; }
    .ruler { height: 24px; position: relative; margin-left: 60px; color: var(--ink-40); font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ruler span { position: absolute; top: 0; transform: translateX(-50%); }
    .ruler span:first-child { transform: none; }
    .track { height: 78px; position: relative; display: flex; align-items: stretch; gap: 3px; overflow-x: auto; overscroll-behavior: contain; padding: 4px; border: 1px solid var(--line-soft); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--bg) 72%, var(--paper)); }
    .playhead-line { position: absolute; z-index: 7; top: 0; bottom: 0; width: 2px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent); pointer-events: none; }
    .playhead-line::before { content: ""; position: absolute; top: 0; left: 50%; width: 8px; height: 8px; border-radius: 2px 2px 999px 999px; background: var(--accent); transform: translate(-50%, -35%); }
    .add-clip { width: 52px; min-width: 52px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-raised); color: var(--ink-60); font-size: 22px; cursor: pointer; }
    .add-clip:hover { border-color: var(--accent); color: var(--accent); }
    .clip { position: relative; flex: 0 0 118px; min-width: 92px; height: 68px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-raised); cursor: grab; user-select: none; transition: border-color var(--fast), opacity var(--fast), transform var(--fast); }
    .clip:hover { border-color: var(--ink-40); }
    .clip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent); }
    .clip.is-dragging { opacity: .52; }
    .clip.drop-before { transform: translateX(5px); }
    .clip.drop-after { transform: translateX(-5px); }
    .clip-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .58; pointer-events: none; }
    .clip::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 25%, oklch(0.08 0.004 80 / .83)); pointer-events: none; }
    .clip-label { position: absolute; z-index: 2; inset: auto 7px 6px; overflow: hidden; color: white; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
    .clip-duration { position: absolute; z-index: 2; top: 5px; right: 5px; padding: 1px 5px; border-radius: 999px; background: oklch(0.08 0.004 80 / .72); color: white; font: 10px/1.5 ui-monospace, monospace; pointer-events: none; }
    .clip-type { position: absolute; z-index: 2; left: 5px; top: 6px; width: 6px; height: 6px; border-radius: 999px; background: var(--image); pointer-events: none; }
    .clip-type.video { background: var(--video); }
    .trim-handle { position: absolute; z-index: 4; top: 0; bottom: 0; width: 12px; border: 0; background: var(--accent); cursor: ew-resize; opacity: .9; }
    .trim-handle.left { left: 0; border-radius: 5px 0 0 5px; }
    .trim-handle.right { right: 0; border-radius: 0 5px 5px 0; }

    .preview-panel { position: absolute; left: 0; bottom: calc(100% + 12px); z-index: 15; width: 620px; height: 350px; display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); }
    .program-head { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 4px; }
    .program-head strong { font-size: 13px; }
    .program-head span { min-width: 0; overflow: hidden; color: var(--ink-60); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .program-head button { margin-left: auto; }
    .preview-media { min-height: 0; flex: 1; position: relative; overflow: hidden; border: 1px solid var(--line-soft); border-radius: var(--radius-sm); background: var(--bg); }
    .preview-media img, .preview-media video { width: 100%; height: 100%; display: block; object-fit: contain; }
    .preview-transport { height: 44px; display: flex; align-items: center; gap: 10px; padding: 2px 2px 0; }
    .play-button { width: 38px; height: 38px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); cursor: pointer; }
    .play-time { color: var(--ink-60); font: 11px/1 ui-monospace, monospace; }
    .program-seek { min-width: 0; flex: 1; accent-color: var(--accent); cursor: pointer; }

    .export-menu { position: absolute; right: calc(100% + 12px); top: 0; z-index: 17; width: 248px; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); }
    .export-scope { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; border-radius: var(--radius-sm); background: var(--ink-10); }
    .export-scope button { min-height: 32px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink-60); cursor: pointer; }
    .export-scope button[aria-checked="true"] { background: var(--paper); color: var(--ink); font-weight: 650; box-shadow: 0 1px 3px color-mix(in srgb, var(--ink) 12%, transparent); }
    .export-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .export-actions button { min-width: 0; min-height: 32px; border-radius: var(--radius-sm); padding: 0 8px; }

    .output-node { width: 230px; height: 126px; overflow: hidden; }
    .output-media { width: 100%; height: 88px; display: block; object-fit: cover; background: var(--ink-10); }
    .output-label { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 10px; }
    .output-label strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .output-label span:last-child { margin-left: auto; color: var(--ink-60); font: 10px/1 ui-monospace, monospace; }

    .dialog-backdrop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 18px; background: oklch(0.08 0.004 80 / .64); }
    .import-dialog { width: min(520px, 100%); border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: var(--shadow); }
    .dialog-head { height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line-soft); }
    .dialog-head strong { font-size: 15px; }
    .dialog-head button { margin-left: auto; }
    .dialog-body { padding: 14px; }
    .drop-zone { min-height: 118px; display: grid; place-items: center; gap: 8px; padding: 16px; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--bg); text-align: center; }
    .drop-zone p { margin: 0; color: var(--ink-60); font-size: 12px; }
    .asset-title { margin: 16px 2px 8px; color: var(--ink-60); font-size: 11px; }
    .asset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .asset { min-width: 0; overflow: hidden; padding: 0; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-raised); cursor: pointer; text-align: left; }
    .asset img { width: 100%; aspect-ratio: 16/9; display: block; object-fit: cover; }
    .asset span { display: block; overflow: hidden; padding: 7px; color: var(--ink-80); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .toast { position: fixed; right: 18px; top: 80px; z-index: 80; max-width: min(360px, calc(100vw - 36px)); min-height: 44px; display: flex; align-items: center; gap: 9px; padding: 10px 13px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); color: var(--ink-80); box-shadow: var(--shadow); }
    .toast::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--accent); }

    @media (max-width: 760px) {
      html { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
      body { height: auto; min-height: 100vh; overflow: visible; }
      .appbar { height: 56px; grid-template-columns: 1fr auto; padding: 0 10px; }
      .brand-mark { width: 28px; height: 28px; }
      .brand-name { font-size: 19px; }
      .crumb, .modes, .app-actions .icon-button:not(.launch) { display: none; }
      .app-actions { grid-column: 2; }
      .workspace { height: 930px; min-height: 930px; }
      .toolrail { display: none; }
      .canvas { inset: 0; overflow-x: hidden; }
      .canvas-stage { width: 100%; min-height: 930px; }
      .source-node { display: none; }
      .clip-node { left: 12px; right: 12px; top: 420px; width: auto; }
      .preview-panel { left: 0; width: 100%; height: 342px; }
      .program-head span { max-width: 150px; }
      .node-head { padding-left: 9px; }
      .node-meta { display: none; }
      .export-trigger { margin-left: auto; }
      .export-menu { right: 0; top: calc(100% + 12px); width: min(248px, calc(100vw - 24px)); }
      .output-node { width: auto; height: 110px; position: relative !important; inset: auto !important; }
      .output-media { height: 74px; }
      #outputs { position: absolute; left: 12px; right: 12px; top: 648px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .zoom-tools { display: none; }
      .ruler { margin-left: 54px; }
      .track { overflow-x: auto; }
      .toast { top: 68px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brandline">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span class="brand-name">No<b>m</b>i</span>
      <div class="crumb"><span>项目库</span><span aria-hidden="true">›</span><strong>城市品牌短片</strong></div>
    </div>
    <nav class="modes" aria-label="工作区">
      <button class="mode">创作</button><button class="mode" aria-pressed="true">生成</button><button class="mode">预览</button>
    </nav>
    <div class="app-actions">
      <button class="icon-button" title="任务中心" aria-label="任务中心">≡</button>
      <button class="icon-button" title="设置" aria-label="设置">·</button>
      <button class="icon-button launch" title="进入预览" aria-label="进入预览">→</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="toolrail" aria-label="画布工具">
      <button class="tool-button" aria-pressed="true">素材</button>
      <button class="tool-button">分组</button>
      <button class="tool-button">提示</button>
      <button class="tool-button">技能</button>
    </aside>
    <section class="canvas" id="canvas" aria-label="生成画布">
      <div class="canvas-stage" id="canvasStage">
        <svg class="edge-layer" id="edgeLayer" aria-hidden="true"></svg>

        <article class="node source-node" id="sourceA">
          <img class="source-media" src="../../../marketing/assets/screen-canvas.png" alt="夜景建立镜头" />
          <div class="source-title"><span class="kind-dot"></span><span>夜景建立镜头</span></div><span class="port out"></span>
        </article>
        <article class="node source-node" id="sourceB">
          <video class="source-media" src="../../../marketing/assets/video/hero-loop.mp4" poster="../../../marketing/assets/video/hero-poster.jpg" muted></video>
          <div class="source-title"><span class="kind-dot video"></span><span>城市节奏视频</span></div><span class="port out"></span>
        </article>

        <article class="node clip-node" id="clipNode" data-mode="compact">
          <span class="port in"></span><span class="port out"></span>
          <section class="preview-panel" id="previewPanel" aria-label="成片预览" hidden>
            <header class="program-head"><strong>成片预览</strong><span id="programClipLabel">播放整条剪辑轴</span><button class="icon-button" id="closePreview" aria-label="收起预览">×</button></header>
            <div class="preview-media" id="previewMedia"></div>
            <div class="preview-transport">
              <button class="play-button" id="playButton" aria-label="播放成片">▶</button>
              <span class="play-time" id="playTime">00:00 / 00:26</span>
              <input class="program-seek" id="programSeek" type="range" min="0" max="26" value="0" step="0.01" aria-label="整片播放头" />
            </div>
          </section>

          <section class="export-menu" id="exportMenu" role="dialog" aria-label="导出选项" hidden>
            <div class="export-scope" role="radiogroup" aria-label="导出范围">
              <button type="button" role="radio" aria-checked="true" data-export-scope-choice="full">完整成片</button>
              <button type="button" role="radio" aria-checked="false" data-export-scope-choice="segments">独立片段 · <span id="exportClipCount">4</span></button>
            </div>
            <div class="export-actions">
              <button class="secondary-button" data-destination="canvas"><span aria-hidden="true">↗</span>到画布</button>
              <button class="primary-button" data-destination="download"><span aria-hidden="true">↓</span>下载</button>
            </div>
          </section>

          <div class="clip-shell">
            <header class="node-head">
              <span class="scissors" aria-hidden="true">✂</span><span class="title">剪辑轴</span>
              <span class="node-meta" id="clipCount">共 4 个片段</span><span class="node-meta">·</span><span class="node-meta" id="totalDuration">总长 00:26</span>
              <button class="secondary-button export-trigger" id="exportTrigger" aria-haspopup="dialog" aria-expanded="false" aria-label="导出" title="导出">↓</button>
            </header>
            <div class="timeline" id="timelineSurface">
              <div class="ruler" id="ruler"></div>
              <div class="track" id="clipTrack" role="region" aria-label="剪辑时间线"></div>
            </div>
          </div>
        </article>

        <div id="outputs" aria-live="polite"></div>
        <div class="zoom-tools" aria-label="画布缩放">
          <button class="icon-button" title="适合画布" aria-label="适合画布">⌗</button>
          <button class="icon-button" title="缩小" aria-label="缩小">−</button>
          <button class="icon-button" title="放大" aria-label="放大">+</button>
        </div>
      </div>
    </section>
  </main>

  <div class="dialog-backdrop" id="importLayer" hidden>
    <section class="import-dialog" role="dialog" aria-modal="true" aria-labelledby="importTitle">
      <header class="dialog-head"><strong id="importTitle">添加片段</strong><span class="node-meta">图片或视频</span><button class="icon-button" id="closeImport" aria-label="关闭">×</button></header>
      <div class="dialog-body">
        <div class="drop-zone">
          <button class="primary-button" id="chooseFile">从电脑导入</button>
          <input id="fileInput" type="file" accept="image/*,video/*" hidden />
          <p>支持图片和视频文件</p>
        </div>
        <div class="asset-title">项目素材</div>
        <div class="asset-grid">
          <button class="asset" data-library-index="0"><img src="../../../marketing/assets/demo-poster.jpg" alt="片头海报" /><span>片头海报</span></button>
          <button class="asset" data-library-index="1"><img src="../../../marketing/assets/screen-agentic.jpg" alt="工作流镜头" /><span>工作流镜头</span></button>
          <button class="asset" data-library-index="2"><img src="../../../marketing/assets/screen-timeline.png" alt="时间轴镜头" /><span>时间轴镜头</span></button>
        </div>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    const assets = {
      canvas: '../../../marketing/assets/screen-canvas.png', poster: '../../../marketing/assets/demo-poster.jpg',
      timeline: '../../../marketing/assets/screen-timeline.png', agent: '../../../marketing/assets/screen-agentic.jpg',
      video: '../../../marketing/assets/video/hero-loop.mp4', videoPoster: '../../../marketing/assets/video/hero-poster.jpg'
    };
    let clips = [
      { id: 'clip-1', label: '夜景建立', type: 'image', duration: 5, src: assets.canvas, thumb: assets.canvas },
      { id: 'clip-2', label: '城市节奏', type: 'video', duration: 7, src: assets.video, thumb: assets.videoPoster },
      { id: 'clip-3', label: '创作过程', type: 'image', duration: 8, src: assets.agent, thumb: assets.agent },
      { id: 'clip-4', label: '片尾落版', type: 'image', duration: 6, src: assets.poster, thumb: assets.poster }
    ];
    let selectedId = null, draggedId = null, toastTimer = null, outputs = [], exportScope = 'full';
    let playheadSeconds = 0, playing = false, playbackFrame = null, lastFrameAt = null;
    const $ = (selector) => document.querySelector(selector);
    const pad = (value) => String(value).padStart(2, '0');
    const formatTime = (seconds) => `${pad(Math.floor(Math.max(0, seconds) / 60))}:${pad(Math.floor(Math.max(0, seconds)) % 60)}`;
    const totalSeconds = () => clips.reduce((sum, clip) => sum + clip.duration, 0);
    const clipStartTime = (id) => {
      const index = clips.findIndex((clip) => clip.id === id);
      return index < 0 ? 0 : clips.slice(0, index).reduce((sum, clip) => sum + clip.duration, 0);
    };
    function clipAtTime(seconds) {
      const total = totalSeconds();
      if (!clips.length || total <= 0) return null;
      const time = Math.max(0, Math.min(seconds, total));
      let start = 0;
      for (let index = 0; index < clips.length; index += 1) {
        const clip = clips[index], end = start + clip.duration;
        if (time < end || index === clips.length - 1) return { clip, index, start, localTime: Math.min(clip.duration, Math.max(0, time - start)) };
        start = end;
      }
      return null;
    }

    function showToast(message) {
      const toast = $('#toast'); toast.textContent = message; toast.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
    }
    function updateSummary() {
      $('#clipCount').textContent = `共 ${clips.length} 个片段`;
      $('#totalDuration').textContent = `总长 ${formatTime(totalSeconds())}`;
      $('#exportClipCount').textContent = String(clips.length);
      const ruler = $('#ruler'), total = totalSeconds(); ruler.innerHTML = '';
      [0, .33, .66, 1].forEach((ratio, index) => {
        const tick = document.createElement('span'); tick.textContent = formatTime(total * ratio);
        tick.style.left = `${ratio * 100}%`; if (index === 3) tick.style.transform = 'translateX(-100%)'; ruler.appendChild(tick);
      });
      $('#programSeek').max = String(total);
    }
    function updatePlayheadLine() {
      const line = $('#timelinePlayhead'), active = clipAtTime(playheadSeconds);
      if (!line || !active) return;
      const element = document.querySelector(`[data-clip-id="${CSS.escape(active.clip.id)}"]`);
      if (!element) return;
      const ratio = active.clip.duration ? active.localTime / active.clip.duration : 0;
      line.style.left = `${element.offsetLeft + element.offsetWidth * ratio}px`;
    }
    function syncProgramMedia(force = false) {
      const active = clipAtTime(playheadSeconds), panel = $('#previewPanel');
      if (!active) { panel.dataset.activeClipId = ''; $('#previewMedia').innerHTML = ''; return; }
      const changed = panel.dataset.activeClipId !== active.clip.id;
      panel.dataset.activeClipId = active.clip.id;
      $('#programClipLabel').textContent = `当前画面 · ${pad(active.index + 1)} / ${pad(clips.length)} · ${active.clip.label}`;
      if (changed || force || !$('#previewMedia').firstElementChild) {
        $('#previewMedia').innerHTML = active.clip.type === 'video'
          ? `<video src="${active.clip.src}" poster="${active.clip.thumb || ''}" muted playsinline preload="auto" aria-label="成片画面"></video>`
          : `<img src="${active.clip.src}" alt="成片当前画面：${active.clip.label}">`;
      }
      const video = $('#previewMedia video');
      if (video) {
        const seekVideo = () => {
          if (!Number.isFinite(video.duration) || video.duration <= 0) return;
          const target = Math.min(Math.max(0, active.localTime), Math.max(0, video.duration - .05));
          if (Math.abs(video.currentTime - target) > .2) video.currentTime = target;
          if (playing) video.play().catch(() => {});
        };
        if (video.readyState >= 1) seekVideo(); else video.addEventListener('loadedmetadata', seekVideo, { once: true });
      }
    }
    function setPlayhead(seconds, { forceMedia = false } = {}) {
      playheadSeconds = Math.max(0, Math.min(Number(seconds) || 0, totalSeconds()));
      $('#programSeek').value = String(playheadSeconds);
      $('#playTime').textContent = `${formatTime(playheadSeconds)} / ${formatTime(totalSeconds())}`;
      syncProgramMedia(forceMedia);
      updatePlayheadLine();
    }
    function stopPlayback() {
      playing = false; lastFrameAt = null;
      if (playbackFrame) cancelAnimationFrame(playbackFrame);
      playbackFrame = null;
      const video = $('#previewMedia video'); if (video) video.pause();
      $('#playButton').textContent = '▶'; $('#playButton').setAttribute('aria-label', '播放成片');
    }
    function playbackTick(now) {
      if (!playing) return;
      if (lastFrameAt === null) lastFrameAt = now;
      const next = playheadSeconds + Math.max(0, now - lastFrameAt) / 1000;
      lastFrameAt = now;
      if (next >= totalSeconds()) { setPlayhead(totalSeconds()); stopPlayback(); return; }
      setPlayhead(next);
      playbackFrame = requestAnimationFrame(playbackTick);
    }
    function startPlayback() {
      if (!clips.length) return;
      if (playheadSeconds >= totalSeconds()) setPlayhead(0, { forceMedia: true });
      playing = true; lastFrameAt = null;
      $('#playButton').textContent = 'Ⅱ'; $('#playButton').setAttribute('aria-label', '暂停成片');
      const video = $('#previewMedia video'); if (video) video.play().catch(() => {});
      playbackFrame = requestAnimationFrame(playbackTick);
    }
    function startTrim(event, clipId, side) {
      event.preventDefault(); event.stopPropagation();
      const clip = clips.find((item) => item.id === clipId); if (!clip) return;
      selectedId = clipId; openPreview();
      const startX = event.clientX, initial = clip.duration, node = event.currentTarget.parentElement;
      const move = (moveEvent) => {
        const delta = (moveEvent.clientX - startX) / 18;
        clip.duration = Math.max(1, Math.min(20, initial + (side === 'right' ? delta : -delta)));
        node.style.flexBasis = `${Math.max(92, Math.min(180, clip.duration * 18))}px`;
        node.querySelector('.clip-duration').textContent = formatTime(clip.duration);
        updateSummary(); setPlayhead(Math.min(playheadSeconds, totalSeconds()));
      };
      const end = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); renderTimeline(); showToast(`已调整「${clip.label}」时长`); };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', end, { once: true });
    }
    function renderTimeline() {
      const track = $('#clipTrack'); track.innerHTML = '';
      const add = document.createElement('button'); add.className = 'add-clip'; add.id = 'addClip'; add.type = 'button'; add.title = '添加素材'; add.setAttribute('aria-label', '添加素材'); add.textContent = '+';
      add.addEventListener('click', (event) => { event.stopPropagation(); closeExport(); $('#importLayer').hidden = false; $('#chooseFile').focus(); }); track.appendChild(add);
      clips.forEach((clip) => {
        const element = document.createElement('div'); element.className = 'clip'; element.draggable = true; element.tabIndex = 0; element.role = 'button';
        element.dataset.testid = 'clip'; element.dataset.clipId = clip.id; element.setAttribute('aria-label', `${clip.label}，${formatTime(clip.duration)}`); element.setAttribute('aria-pressed', clip.id === selectedId ? 'true' : 'false');
        element.style.flexBasis = `${Math.max(92, Math.min(180, clip.duration * 18))}px`;
        element.innerHTML = `<img class="clip-thumb" src="${clip.thumb || clip.src}" alt=""><span class="clip-type ${clip.type === 'video' ? 'video' : ''}"></span><span class="clip-duration">${formatTime(clip.duration)}</span><span class="clip-label">${clip.label}</span>`;
        if (clip.id === selectedId) {
          ['left', 'right'].forEach((side) => { const handle = document.createElement('button'); handle.className = `trim-handle ${side}`; handle.type = 'button'; handle.setAttribute('aria-label', side === 'left' ? '调整片段入点' : '调整片段出点'); handle.addEventListener('pointerdown', (event) => startTrim(event, clip.id, side)); element.appendChild(handle); });
        }
        element.addEventListener('click', (event) => {
          if (event.target.closest('.trim-handle')) return;
          const rect = element.getBoundingClientRect(), ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
          selectClip(clip.id, ratio);
        });
        element.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectClip(clip.id, 0); } });
        element.addEventListener('dragstart', (event) => { draggedId = clip.id; element.classList.add('is-dragging'); event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', clip.id); });
        element.addEventListener('dragover', (event) => { event.preventDefault(); if (!draggedId || draggedId === clip.id) return; const rect = element.getBoundingClientRect(); element.classList.toggle('drop-before', event.clientX < rect.left + rect.width / 2); element.classList.toggle('drop-after', event.clientX >= rect.left + rect.width / 2); });
        element.addEventListener('dragleave', () => element.classList.remove('drop-before', 'drop-after'));
        element.addEventListener('drop', (event) => { event.preventDefault(); const from = clips.findIndex((item) => item.id === draggedId), target = clips.findIndex((item) => item.id === clip.id); if (from < 0 || target < 0 || from === target) return; const before = event.clientX < element.getBoundingClientRect().left + element.getBoundingClientRect().width / 2; const [moved] = clips.splice(from, 1); let destination = clips.findIndex((item) => item.id === clip.id) + (before ? 0 : 1); clips.splice(destination, 0, moved); renderTimeline(); showToast('片段顺序已更新'); });
        element.addEventListener('dragend', () => { draggedId = null; renderTimeline(); }); track.appendChild(element);
      });
      const playhead = document.createElement('span'); playhead.className = 'playhead-line'; playhead.id = 'timelinePlayhead'; playhead.dataset.testid = 'timeline-playhead'; playhead.setAttribute('aria-hidden', 'true'); track.appendChild(playhead);
      updateSummary(); requestAnimationFrame(() => { updatePlayheadLine(); renderEdges(); });
    }
    function selectClip(id, ratio = 0) {
      const clip = clips.find((item) => item.id === id); if (!clip) return;
      stopPlayback(); selectedId = id; playheadSeconds = clipStartTime(id) + clip.duration * ratio; closeExport(); renderTimeline(); openPreview();
    }
    function openPreview() {
      if (!clips.length) return;
      $('#clipNode').dataset.mode = 'editing'; $('#previewPanel').hidden = false;
      setPlayhead(playheadSeconds, { forceMedia: true }); requestAnimationFrame(renderEdges);
    }
    function closePreview() { stopPlayback(); selectedId = null; $('#previewPanel').hidden = true; $('#clipNode').dataset.mode = 'compact'; renderTimeline(); }
    function closeExport() { $('#exportMenu').hidden = true; $('#exportTrigger').setAttribute('aria-expanded', 'false'); }
    function splitSelected() {
      const index = clips.findIndex((item) => item.id === selectedId); if (index < 0) return;
      const source = clips[index], start = clipStartTime(source.id), splitAt = playheadSeconds - start;
      if (splitAt < .5 || splitAt > source.duration - .5) { showToast('请把播放头放到所选片段内部'); return; }
      const tailDuration = source.duration - splitAt, copy = { ...source, id: `${source.id}-split-${Date.now()}`, label: `${source.label} B`, duration: tailDuration };
      source.duration = splitAt; clips.splice(index + 1, 0, copy); selectedId = copy.id; renderTimeline(); openPreview(); setPlayhead(start + splitAt, { forceMedia: true }); showToast('已在全局播放头处分割');
    }
    function duplicateSelected() {
      const index = clips.findIndex((item) => item.id === selectedId); if (index < 0) return;
      const source = clips[index], copy = { ...source, id: `${source.id}-copy-${Date.now()}`, label: `${source.label} 副本` };
      clips.splice(index + 1, 0, copy); selectedId = copy.id; renderTimeline(); openPreview(); setPlayhead(clipStartTime(copy.id), { forceMedia: true }); showToast('已复制片段');
    }
    function deleteSelected() {
      const index = clips.findIndex((item) => item.id === selectedId); if (index < 0) return;
      stopPlayback(); const start = clipStartTime(selectedId), [removed] = clips.splice(index, 1);
      if (!clips.length) { closePreview(); showToast(`已移除「${removed.label}」`); return; }
      selectedId = clips[Math.min(index, clips.length - 1)].id; renderTimeline(); openPreview(); setPlayhead(Math.min(start, totalSeconds()), { forceMedia: true }); showToast(`已移除「${removed.label}」`);
    }
    function addClip(item) {
      clips.push({ ...item, id: `clip-${Date.now()}` }); $('#importLayer').hidden = true; selectedId = clips.at(-1).id;
      renderTimeline(); openPreview(); setPlayhead(clipStartTime(selectedId), { forceMedia: true }); showToast(`已导入「${item.label}」`);
    }

    function makeOutput(clip, index, full = false) { return { ...clip, id: `output-${full ? 'full' : clip.id}-${Date.now()}-${index}`, label: full ? '剪辑成片' : `片段 ${pad(index + 1)} · ${clip.label}`, duration: full ? totalSeconds() : clip.duration }; }
    function renderOutputs() {
      const container = $('#outputs'); container.innerHTML = '';
      outputs.forEach((output, index) => {
        const node = document.createElement('article'); node.className = 'node output-node'; node.dataset.testid = 'output-node'; node.dataset.sourceClipId = output.sourceClipId || '';
        node.style.left = '1080px'; node.style.top = `${90 + index * 146}px`;
        node.innerHTML = `<span class="port in"></span><img class="output-media" src="${output.thumb || output.src}" alt="${output.label}"><div class="output-label"><span class="kind-dot video"></span><strong>${output.label}</strong><span>${formatTime(output.duration)}</span></div>`; container.appendChild(node);
      });
      requestAnimationFrame(renderEdges);
    }
    function renderEdges() {
      const stage = $('#canvasStage'), svg = $('#edgeLayer'), stageRect = stage.getBoundingClientRect(); svg.innerHTML = '';
      const connect = (from, to, output = false) => {
        if (!from || !to || from.offsetParent === null || to.offsetParent === null) return;
        const a = from.getBoundingClientRect(), b = to.getBoundingClientRect(), x1 = a.right - stageRect.left, y1 = a.top + a.height / 2 - stageRect.top, x2 = b.left - stageRect.left, y2 = b.top + b.height / 2 - stageRect.top, bend = Math.max(70, Math.abs(x2 - x1) * .42);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('d', `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`); path.setAttribute('class', `edge${output ? ' output' : ''}`); if (output) path.dataset.testid = 'output-edge'; svg.appendChild(path);
        if (output) { const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); dot.setAttribute('cx', x2); dot.setAttribute('cy', y2); dot.setAttribute('r', 4); dot.setAttribute('class', 'edge-dot'); svg.appendChild(dot); }
      };
      connect($('#sourceA'), $('#clipNode')); connect($('#sourceB'), $('#clipNode')); document.querySelectorAll('[data-testid="output-node"]').forEach((node) => connect($('#clipNode'), node, true));
    }
    function exportToCanvas(scope) {
      outputs = scope === 'full' ? [makeOutput({ ...clips[0], thumb: clips[0].thumb, src: clips[0].src }, 0, true)] : clips.map((clip, index) => ({ ...makeOutput(clip, index), sourceClipId: clip.id }));
      renderOutputs(); closeExport(); showToast(scope === 'full' ? '完整视频已导出到画布' : `${clips.length} 个片段已导出到画布`);
    }
    function downloadExport(scope) {
      const name = scope === 'full' ? 'nomi-full-cut.mp4' : `nomi-segments-${clips.length}.zip`;
      const payload = JSON.stringify({ prototype: true, scope, clips: clips.map(({ id, label, duration, type }) => ({ id, label, duration, type })) }, null, 2);
      const url = URL.createObjectURL(new Blob([payload], { type: scope === 'full' ? 'video/mp4' : 'application/zip' })); const anchor = document.createElement('a'); anchor.href = url; anchor.download = name; document.body.appendChild(anchor); anchor.click(); anchor.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); closeExport(); showToast(scope === 'full' ? '完整视频开始下载' : `${clips.length} 个片段开始下载`);
    }

    $('#playButton').addEventListener('click', () => playing ? stopPlayback() : startPlayback());
    $('#programSeek').addEventListener('input', (event) => { lastFrameAt = performance.now(); setPlayhead(event.currentTarget.value, { forceMedia: true }); });
    $('#closePreview').addEventListener('click', closePreview);
    $('#exportTrigger').addEventListener('click', (event) => { event.stopPropagation(); const willOpen = $('#exportMenu').hidden; $('#exportMenu').hidden = !willOpen; $('#exportTrigger').setAttribute('aria-expanded', String(willOpen)); });
    document.querySelectorAll('[data-export-scope-choice]').forEach((button) => button.addEventListener('click', () => {
      exportScope = button.dataset.exportScopeChoice;
      document.querySelectorAll('[data-export-scope-choice]').forEach((choice) => choice.setAttribute('aria-checked', String(choice === button)));
    }));
    document.querySelectorAll('[data-destination]').forEach((button) => button.addEventListener('click', () => button.dataset.destination === 'canvas' ? exportToCanvas(exportScope) : downloadExport(exportScope)));
    $('#timelineSurface').addEventListener('click', (event) => {
      if (event.target.closest('button, [data-testid="clip"]')) return;
      const ruler = $('#ruler'), rect = ruler.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / Math.max(1, rect.width)));
      playheadSeconds = totalSeconds() * ratio;
      const active = clipAtTime(playheadSeconds); if (!active) return;
      selectedId = active.clip.id; renderTimeline(); openPreview();
    });
    $('#chooseFile').addEventListener('click', () => $('#fileInput').click()); $('#closeImport').addEventListener('click', () => { $('#importLayer').hidden = true; });
    $('#fileInput').addEventListener('change', () => { const file = $('#fileInput').files[0]; if (!file) return; const type = file.type.startsWith('video/') ? 'video' : 'image', url = URL.createObjectURL(file); addClip({ label: file.name.replace(/\.[^.]+$/, ''), type, duration: 6, src: url, thumb: type === 'video' ? assets.videoPoster : url }); $('#fileInput').value = ''; });
    document.querySelectorAll('[data-library-index]').forEach((button) => button.addEventListener('click', () => { const index = Number(button.dataset.libraryIndex), library = [
      { label: '片头海报', type: 'image', duration: 5, src: assets.poster, thumb: assets.poster }, { label: '工作流镜头', type: 'image', duration: 6, src: assets.agent, thumb: assets.agent }, { label: '时间轴镜头', type: 'image', duration: 6, src: assets.timeline, thumb: assets.timeline }
    ]; addClip(library[index]); }));
    $('#importLayer').addEventListener('click', (event) => { if (event.target === event.currentTarget) $('#importLayer').hidden = true; });
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { if (!$('#importLayer').hidden) $('#importLayer').hidden = true; else if (!$('#exportMenu').hidden) closeExport(); else closePreview(); return; }
      if (!selectedId || event.target.closest('input, textarea, select')) return;
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'd') { event.preventDefault(); duplicateSelected(); return; }
      if (event.key.toLowerCase() === 's') { event.preventDefault(); splitSelected(); return; }
      if (event.key === 'Delete' || event.key === 'Backspace') { event.preventDefault(); deleteSelected(); }
    });
    window.addEventListener('resize', () => requestAnimationFrame(renderEdges));
    renderTimeline(); renderOutputs();
  </script>
</body>
</html>
